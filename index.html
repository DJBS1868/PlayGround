  } else if (p.type === 'ashpile'){
    ctx.fillStyle = 'rgba(0,0,0,.24)';
    ctx.beginPath(); ctx.ellipse(x+3,y+5,14+s*8,6+s*3,0,0,6.3); ctx.fill();
    ctx.fillStyle = '#4a4040';
    ctx.beginPath(); ctx.ellipse(x,y,13+s*9,7+s*4,0,0,6.3); ctx.fill();
    ctx.fillStyle = '#5c4e4c';
    ctx.beginPath(); ctx.ellipse(x-3,y-2,7+s*4,3+s*2,0,0,6.3); ctx.fill();
    ctx.fillStyle = `rgba(255,130,50,${.5+Math.sin(S.t*5+tone*9)*.3})`;
    ctx.beginPath(); ctx.arc(x-5,y,1.5,0,6.3); ctx.arc(x+5,y-2,1.3,0,6.3); ctx.fill();
  } else if (p.type === 'crack'){
    const flick = .55 + Math.sin(S.t*3 + tone*8)*.25;
    const pts = [[-17,4],[-8,-4],[-2,2],[6,-6],[14,1],[19,-2]];
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(255,84,26,${flick*.5})`; ctx.lineWidth = 7;
    ctx.beginPath(); pts.forEach(([dx,dy],i)=> i?ctx.lineTo(x+dx,y+dy):ctx.moveTo(x+dx,y+dy)); ctx.stroke();
    ctx.strokeStyle = `rgba(255,190,80,${flick})`; ctx.lineWidth = 2;
    ctx.beginPath(); pts.forEach(([dx,dy],i)=> i?ctx.lineTo(x+dx,y+dy):ctx.moveTo(x+dx,y+dy)); ctx.stroke();
  } else if (p.type === 'obsidian'){
    const k = .8 + s*.5;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(x+4,y+6,11*k,5*k,0,0,6.3); ctx.fill();
    ctx.fillStyle = '#16151c';
    ctx.beginPath(); ctx.moveTo(x-10*k,y+7*k); ctx.lineTo(x-5*k,y-14*k);
    ctx.lineTo(x+3*k,y-19*k); ctx.lineTo(x+10*k,y+6*k); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(150,110,210,.35)';
    ctx.beginPath(); ctx.moveTo(x-5*k,y-14*k); ctx.lineTo(x+3*k,y-19*k);
    ctx.lineTo(x+1*k,y-5*k); ctx.closePath(); ctx.fill();
  } else if (p.type === 'mesa'){
    const k = .8 + s*.8;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(x+6,y+12,44*k,16*k,0,0,6.3); ctx.fill();
    ctx.fillStyle = '#8a5f38';
    ctx.beginPath(); ctx.moveTo(x-46*k,y+10*k); ctx.lineTo(x-32*k,y-24*k);
    ctx.lineTo(x+30*k,y-24*k); ctx.lineTo(x+46*k,y+10*k); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a5764a'; ctx.fillRect(x-34*k,y-24*k,64*k,8*k);
    ctx.fillStyle = '#b98a58'; ctx.fillRect(x-30*k,y-30*k,52*k,7*k);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.moveTo(x+12*k,y-24*k); ctx.lineTo(x+46*k,y+10*k);
    ctx.lineTo(x+18*k,y+10*k); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#222e1b'; ctx.fillRect(0,0,W,H);
  const ox = W/2 - S.cam.x, oy = H*S.focusF - S.cam.y;
  const shx = (Math.random()-.5)*S.shake*16, shy = (Math.random()-.5)*S.shake*16;
  ctx.save(); ctx.translate(ox+shx, oy+shy);

  const vy0 = S.cam.y - H*0.65, vy1 = S.cam.y + H*0.65;
  const props = propsInView(S.cam.y, 420);

  // biome-blended ground
  ctx.fillStyle = biomeGradient('ground', vy0, vy1, 28);
  ctx.fillRect(-2600, vy0, 5200, vy1-vy0);
  for (const p of props) if (p.type==='patch'){
    const m = biomeMix(p.y);
    const pa = BIOMES[m.a].patch[p.tone < .5 ? 0 : 1];
    const pb = BIOMES[m.b].patch[p.tone < .5 ? 0 : 1];
    const c = m.t ? mix3(pa, pb, m.t) : pa;
    const a = m.t ? pa[3] + (pb[3]-pa[3])*m.t : pa[3];
    ctx.fillStyle = rgbCss(c, a);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.s*1.7, p.s, 0, 0, 6.3); ctx.fill();
  }
  // ballast + sleepers take their colour from the biome under them
  ctx.fillStyle = biomeGradient('bed', vy0, vy1, 24);
  ctx.fillRect(-46, vy0, 92, vy1-vy0);
  ctx.lineWidth = 7;
  for (let y = Math.floor(vy0/34)*34; y < vy1; y += 34){
    ctx.strokeStyle = biomeColorCssAt(y, 'tie');
    ctx.beginPath(); ctx.moveTo(-40,y); ctx.lineTo(40,y); ctx.stroke();
  }
  ctx.strokeStyle = '#8a8f96'; ctx.lineWidth = 3.4;
  for (const rx of [-13, 13]){ ctx.beginPath(); ctx.moveTo(rx, vy0); ctx.lineTo(rx, vy1); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,240,200,.25)'; ctx.lineWidth = 1;
  for (const rx of [-13, 13]){ ctx.beginPath(); ctx.moveTo(rx, vy0); ctx.lineTo(rx, vy1); ctx.stroke(); }

  // ground-level scenery first, so pickups and trees sit on top
  for (const p of props){
    if (p.type === 'grass') drawGrassProp(p);
    else if (GROUND_DECOR[p.type]) drawDecorProp(p);
  }

  for (const p of props){
    if (p.type==='patch' || p.type==='grass' || GROUND_DECOR[p.type]) continue;
    if (p.type==='tree' && !p.taken){
      drawTreeProp(p);
    } else if (p.type==='rock'){
      drawRockProp(p);
    } else if (p.type==='cactus' || p.type==='mesa' || p.type==='iceberg' || p.type==='obsidian'){
      drawDecorProp(p);
    } else if (p.type==='depot'){
      drawDepot(p);
    } else if (p.type==='sign'){
      ctx.fillStyle = '#7a6a4a'; ctx.fillRect(p.x-2,p.y,4,20);
      ctx.fillStyle = '#e8d9a8'; ctx.fillRect(p.x-22,p.y-16,44,18);
      ctx.strokeStyle = '#4a4030'; ctx.strokeRect(p.x-22,p.y-16,44,18);
      ctx.fillStyle = '#3a3226'; ctx.font = '700 11px system-ui'; ctx.textAlign='center';
      ctx.fillText(p.m+' m', p.x, p.y-3);
    } else if (p.type==='finish'){
      drawFinishGate(p.y);
    } else if (['coal','wood','scrap','food'].includes(p.type) && !p.taken){
      drawRes(p);
    } else if (p.type==='debris' && !p.taken){
      drawDebris(p);
    }
  }
  for (const q of S.smoke){ ctx.fillStyle = `rgba(210,210,205,${(q.t/1.1)*.5})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.s*.5, 0, 6.3); ctx.fill(); }

  drawTrain();

  for (const b of S.beams){
    ctx.globalAlpha = Math.max(0, b.t/.12);
    ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(b.x1,b.y1); ctx.lineTo(b.x2,b.y2); ctx.stroke();
    ctx.fillStyle = '#fff2c0'; ctx.beginPath(); ctx.arc(b.x2,b.y2,2.5,0,6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (S.player.aboard) drawPlayer(S.player.x, S.player.y, S.player.dir, S.player.atkT);

  for (const z of S.zombies) drawZombie(z);

  if (!S.player.aboard) drawPlayer(S.player.x, S.player.y, S.player.dir, S.player.atkT);

  for (const q of S.parts){ ctx.globalAlpha = Math.min(1, q.t*2);
    ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x,q.y,3.2,0,6.3); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.font = '800 13px system-ui'; ctx.textAlign = 'center';
  for (const q of S.texts){ ctx.globalAlpha = Math.min(1, q.t*2);
    ctx.fillStyle = '#000a'; ctx.fillText(q.txt, q.x+1, q.y+1);
    ctx.fillStyle = q.c; ctx.fillText(q.txt, q.x, q.y); }
  ctx.globalAlpha = 1;

  for (const a of S.amb){
    ctx.globalAlpha = Math.min(1, a.t/0.6) * .85;
    ctx.fillStyle = a.c;
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  const vg = ctx.createRadialGradient(W/2,H*.5,H*.42, W/2,H*.5, H*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.34)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  const wash = biomeWashAt(S.cam.y);
  ctx.fillStyle = `rgba(${wash[0]|0},${wash[1]|0},${wash[2]|0},${wash[3]})`;
  ctx.fillRect(0,0,W,H);
  if (S.hitFlash > 0){
    ctx.fillStyle = `rgba(200,40,30,${S.hitFlash*.18})`; ctx.fillRect(0,0,W,H);
  }
  if (!S.player.aboard && S.mode==='play'){
    const sy = S.train.y + oy;
    if (sy < -30 || sy > H+30){
      const ax = W/2, ay = clamp(sy, 40, H-90), dirn = sy < 0 ? -1 : 1;
      ctx.fillStyle = 'rgba(243,193,75,.92)';
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax-13, ay+dirn*-16); ctx.lineTo(ax+13, ay+dirn*-16);
      ctx.closePath(); ctx.fill();
      ctx.font='700 12px system-ui'; ctx.textAlign='center'; ctx.fillStyle='#ffe9b0';
      ctx.fillText('🚂 ' + Math.round(Math.abs(S.train.y - S.player.y)/PPM) + ' m', ax, ay+dirn*14);
    }
  }
  if (S.joy.active){
    const j = S.joy;
    ctx.fillStyle = 'rgba(20,26,20,.4)'; ctx.beginPath(); ctx.arc(j.bx,j.by,52,0,6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(240,230,200,.35)'; ctx.lineWidth = 2; ctx.stroke();
    const k = Math.min(1, Math.hypot(j.dx,j.dy)), ka = Math.atan2(j.dy,j.dx);
    ctx.fillStyle = 'rgba(243,193,75,.9)';
    ctx.beginPath(); ctx.arc(j.bx + Math.cos(ka)*k*36, j.by + Math.sin(ka)*k*36, 22, 0, 6.3); ctx.fill();
  }
}

/* ---------- resource / debris art ---------- */
function drawRes(p){
  const {x,y} = p;
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(x+3,y+6,11,5,0,0,6.3); ctx.fill();
  if (p.type === 'coal'){
    ctx.fillStyle = '#23282e';
    for (const [dx,dy] of [[-5,2],[4,-1],[0,-5],[6,4]]){ ctx.beginPath(); ctx.arc(x+dx,y+dy,5,0,6.3); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.beginPath(); ctx.arc(x-5,y,2,0,6.3); ctx.fill();
  } else if (p.type === 'wood'){
    ctx.fillStyle = '#7a5a34';
    for (let i=0;i<3;i++){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x-12, y-8+i*7, 24, 6, 3) : ctx.rect(x-12, y-8+i*7, 24, 6); ctx.fill(); }
    ctx.strokeStyle = '#4a3620'; ctx.lineWidth = 1.4;
    for (let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(x-12,y-5+i*7); ctx.lineTo(x+12,y-5+i*7); ctx.stroke(); }
  } else if (p.type === 'scrap'){
    ctx.fillStyle = '#8b929c';
    ctx.fillRect(x-11, y-3, 14, 8); ctx.fillRect(x-2, y-8, 12, 7);
    ctx.fillStyle = '#5a616b'; ctx.fillRect(x-8, y-1, 8, 4); ctx.fillRect(x+2, y-6, 8, 3);
    ctx.strokeStyle = '#c8ced6'; ctx.lineWidth=1; ctx.strokeRect(x-11, y-3, 14, 8);
  } else if (p.type === 'food'){
    ctx.fillStyle = '#b8433a'; ctx.fillRect(x-7, y-9, 14, 17);
    ctx.fillStyle = '#d9d3c4'; ctx.fillRect(x-7, y-4, 14, 5);
    ctx.fillStyle = '#8a2e28'; ctx.fillRect(x-7, y-9, 14, 3);
  }
}
function drawDebris(p){
  const {x,y} = p;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x,y+5,22,7,0,0,6.3); ctx.fill();
  if (p.kind === 'log'){
    fr(x-22, y-6, 44, 12, 6, '#7a5a34');
    ctx.fillStyle = '#5a4024'; ctx.beginPath(); ctx.arc(x-20,y,6,0,6.3); ctx.arc(x+20,y,6,0,6.3); ctx.fill();
    ctx.fillStyle = '#8f6c40'; ctx.beginPath(); ctx.arc(x-20,y,3,0,6.3); ctx.arc(x+20,y,3,0,6.3); ctx.fill();
  } else {
    ctx.fillStyle = '#565a5e';
    for (const [dx,dy,r] of [[-10,2,8],[8,-3,7],[0,5,6]]){
      ctx.beginPath(); ctx.arc(x+dx,y+dy,r,0,6.3); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(x-11,y,2.6,0,6.3); ctx.fill();
  }
  if (p.warn){
    ctx.globalAlpha = .55 + Math.sin(S.t*9)*.35;
    ctx.fillStyle = '#ff5a4a'; ctx.font='800 17px system-ui'; ctx.textAlign='center';
    ctx.fillText('!', x, y-16); ctx.globalAlpha = 1;
  }
}

/* ---------- depot houses ---------- */
function drawDepot(p){
  const x = p.x, y = p.y;
  const B = BIOMES[biomeIdxAt(p.y)];
  const rnd = mul32((Math.abs(x)*73 + Math.abs(y)*29 + 11) | 0);
  const style = Math.floor(Math.abs(y)/CHUNK) % 3;
  const bi = B.id, wall = B.depot, roof = B.roof || '#4f3d2a';
  const lit = B.roofLit || shade(roof,.22), dark = B.roofDark || shade(roof,-.30);
  const ridgeC = mixHex(lit, '#fff2d8', .26), eaveC = mixHex(dark, '#0a0806', .28);
  const trim = shade(wall,-.28), trim2 = shade(wall,-.38);
  const back = -64, ridge = -20, eave = 16, wallBot = 52;
  const poly = (pts,fill)=>{
    ctx.fillStyle = fill; ctx.beginPath();
    pts.forEach(([px,py],i)=> i ? ctx.lineTo(px,py) : ctx.moveTo(px,py));
    ctx.closePath(); ctx.fill();
  };

  ctx.save();

  /* ground shadow and worn yard */
  ctx.fillStyle = 'rgba(0,0,0,.13)';
  ctx.beginPath(); ctx.ellipse(x+7, y+16, 97, 56, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.19)';
  ctx.beginPath(); ctx.ellipse(x, y+50, 84, 16, 0, 0, 6.3); ctx.fill();

  /* side returns and front wall */
  fr(x-77, y-18, 10, 70, 2, trim);
  fr(x+67, y-18, 10, 70, 2, trim2);
  fr(x-77, y+2, 154, 50, 3, wall);
  ctx.strokeStyle = 'rgba(0,0,0,.16)'; ctx.lineWidth = 1;
  for (let sx=x-66; sx<x+70; sx+=11){
    ctx.beginPath(); ctx.moveTo(sx, y+16); ctx.lineTo(sx, y+wallBot); ctx.stroke();
  }
  fr(x-77, y+8, 7, 44, 1, trim);
  fr(x+70, y+8, 7, 44, 1, trim2);
  fr(x-78, y+46, 156, 6, 1, shade(wall,-.45));

  /* windows */
  const winGlow = (cx)=>{
    fr(cx-16, y+21, 32, 21, 2, '#3a2a1e');
    const g = ctx.createLinearGradient(0, y+23, 0, y+40);
    if (bi === 'ash'){
      g.addColorStop(0,'rgba(255,170,90,.95)'); g.addColorStop(1,'rgba(210,80,40,.9)');
    } else {
      g.addColorStop(0,'rgba(255,232,164,.96)'); g.addColorStop(1,'rgba(232,166,78,.9)');
    }
    ctx.fillStyle = g; ctx.fillRect(cx-13, y+24, 26, 15);
    ctx.strokeStyle = '#3a2a1e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, y+24); ctx.lineTo(cx, y+39);
    ctx.moveTo(cx-13, y+31); ctx.lineTo(cx+13, y+31); ctx.stroke();
    fr(cx-18, y+42, 36, 3, 1, '#2e2418');
    // shutters
    fr(cx-23, y+23, 5, 16, 1, trim2); fr(cx+18, y+23, 5, 16, 1, trim2);
    // sleepy light spill on the siding
    const sp = ctx.createLinearGradient(0, y+43, 0, y+wallBot);
    sp.addColorStop(0,'rgba(255,210,130,.16)'); sp.addColorStop(1,'rgba(255,210,130,0)');
    ctx.fillStyle = sp; ctx.fillRect(cx-15, y+43, 30, wallBot-43);
  };
  winGlow(x-45); winGlow(x+45);

  /* door and warm crack */
  fr(x-15, y+19, 30, 33, 2, '#2b211a');
  fr(x-12, y+22, 24, 28, 1, '#4b3522');
  ctx.strokeStyle = '#332418'; ctx.lineWidth = 1.5;
  ctx.strokeRect(x-8, y+25, 16, 9); ctx.strokeRect(x-8, y+37, 16, 10);
  ctx.fillStyle = '#d8b46a';
  ctx.beginPath(); ctx.arc(x+8, y+37, 1.6, 0, 6.3); ctx.fill();
  ctx.fillStyle = `rgba(255,196,110,${.16+Math.sin(S.t*2.2)*.04})`;
  ctx.fillRect(x-15, y+47, 30, 4);

  /* porch, rail and steps */
  fr(x-66, y+50, 132, 23, 2, shade(wall,-.30));
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 1;
  for (let py=y+55; py<y+72; py+=5){
    ctx.beginPath(); ctx.moveTo(x-64, py); ctx.lineTo(x+64, py); ctx.stroke();
  }
  const sp2 = ctx.createLinearGradient(0, y+50, 0, y+74);
  sp2.addColorStop(0,'rgba(255,214,140,.20)'); sp2.addColorStop(1,'rgba(255,214,140,0)');
  ctx.fillStyle = sp2; ctx.fillRect(x-15, y+50, 30, 24);
  ctx.strokeStyle = trim2; ctx.lineWidth = 2;
  for (const side of [-1,1]){
    const rx = x + side*61;
    ctx.beginPath(); ctx.moveTo(rx, y+54); ctx.lineTo(rx, y+70); ctx.stroke();
    fr(rx-2, y+52, 4, 4, 1, '#2e2418'); fr(rx-2, y+67, 4, 4, 1, '#2e2418');
  }
  fr(x-19, y+73, 38, 5, 1, shade(wall,-.38));
  fr(x-16, y+78, 32, 5, 1, shade(wall,-.46));

  /* roof */
  if (style === 0){
    poly([[x-88,y+back],[x+88,y+back],[x+80,y+ridge],[x-80,y+ridge]], dark);
    const fg = ctx.createLinearGradient(0, y+ridge, 0, y+eave);
    fg.addColorStop(0, lit); fg.addColorStop(1, mixHex(lit, '#15100e', .18));
    poly([[x-80,y+ridge],[x+80,y+ridge],[x+88,y+eave],[x-88,y+eave]], fg);
    ctx.strokeStyle = 'rgba(0,0,0,.17)'; ctx.lineWidth = 1.2;
    for (let i=1;i<=3;i++){
      const t = i/4, yy = lerp(y+back, y+ridge, t), hw = lerp(88,80,t);
      ctx.beginPath(); ctx.moveTo(x-hw,yy); ctx.lineTo(x+hw,yy); ctx.stroke();
    }
    for (let i=1;i<=4;i++){
      const t = i/5, yy = lerp(y+ridge, y+eave, t), hw = lerp(80,88,t);
      ctx.beginPath(); ctx.moveTo(x-hw,yy); ctx.lineTo(x+hw,yy); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.11)';
      for (let k=-4;k<=4;k++){
        if ((k+i) % 2) continue;
        const sx = x + k*hw/4.6;
        ctx.beginPath(); ctx.moveTo(sx,yy); ctx.lineTo(sx, yy+8); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(0,0,0,.17)';
    }
    fr(x-82, y+ridge-4, 164, 8, 4, ridgeC);
    fr(x-89, y+eave-2, 178, 6, 3, eaveC);
    ctx.strokeStyle = eaveC; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x-88,y+back); ctx.lineTo(x-88,y+eave);
    ctx.moveTo(x+88,y+back); ctx.lineTo(x+88,y+eave); ctx.stroke();
  } else if (style === 1){
    /* hip roof: four slopes, ridge parallel to the track */
    const ry = -24, rw = 56;
    const gl = ctx.createLinearGradient(0, ry, 0, y+eave);
    gl.addColorStop(0, lit); gl.addColorStop(1, mixHex(lit, '#140f0c', .24));
    poly([[x-88,y+eave],[x+88,y+eave],[x+rw,y+ry],[x-rw,y+ry]], gl);
    const gb = ctx.createLinearGradient(0, y+back, 0, ry);
    gb.addColorStop(0, dark); gb.addColorStop(1, mixHex(dark, lit, .22));
    poly([[x-88,y+back],[x+88,y+back],[x+rw,y+ry],[x-rw,y+ry]], gb);
    const glh = ctx.createLinearGradient(x-88, 0, x-rw, 0);
    glh.addColorStop(0, mixHex(dark, lit, .38)); glh.addColorStop(1, lit);
    poly([[x-88,y+back],[x-88,y+eave],[x-rw,y+ry]], glh);
    const grh = ctx.createLinearGradient(x+rw, 0, x+88, 0);
    grh.addColorStop(0, lit); grh.addColorStop(1, mixHex(dark, lit, .30));
    poly([[x+88,y+back],[x+88,y+eave],[x+rw,y+ry]], grh);
    /* shingle courses on the far slope */
    for (let i=1;i<=3;i++){
      const t = i/4, yy = lerp(y+back, ry, t), hw = lerp(88, rw, t);
      ctx.strokeStyle = `rgba(0,0,0,${.20-t*.04})`; ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.moveTo(x-hw,yy); ctx.lineTo(x+hw,yy); ctx.stroke();
    }
    /* shingle courses on the near slope */
    ctx.lineWidth = 1.1;
    for (let i=1;i<=5;i++){
      const t = i/6;
      const yy = lerp(y+eave, ry, t), hw = lerp(88, rw, t);
      ctx.strokeStyle = `rgba(20,14,10,${.10+t*.10})`;
      ctx.beginPath(); ctx.moveTo(x-hw,yy); ctx.lineTo(x+hw,yy); ctx.stroke();
      if (i < 5){
        ctx.strokeStyle = 'rgba(255,255,255,.05)';
        for (let k=-8;k<=8;k++){
          if ((k+i) % 2) continue;
          const sx2 = x + k*hw/9;
          ctx.beginPath(); ctx.moveTo(sx2,yy); ctx.lineTo(sx2, lerp(y+eave, ry, (i+1)/6)); ctx.stroke();
        }
      }
    }
    /* hip seams */
    ctx.strokeStyle = 'rgba(15,10,8,.22)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(x-88,y+back); ctx.lineTo(x-rw,y+ry);
    ctx.moveTo(x-88,y+eave); ctx.lineTo(x-rw,y+ry);
    ctx.moveTo(x+88,y+back); ctx.lineTo(x+rw,y+ry);
    ctx.moveTo(x+88,y+eave); ctx.lineTo(x+rw,y+ry);
    ctx.stroke();
    /* ridge and eaves */
    fr(x-rw-3, ry-4, rw*2+6, 8, 4, ridgeC);
    fr(x-90, y+back-1, 180, 5, 2, mixHex(lit, '#fff2d8', .16));
    ctx.strokeStyle = eaveC; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x-89,y+back); ctx.lineTo(x-89,y+eave);
    ctx.lineTo(x+89,y+eave); ctx.lineTo(x+89,y+back); ctx.stroke();
    fr(x-89, y+eave-3, 178, 6, 3, eaveC);
  } else {
    /* flat tar roof with a parapet, skylight, vent and water tank */
    const base = mixHex('#3b3d3e', roof, .34);
    fr(x-88, y+back, 176, 80, 3, base);
    for (let i=0;i<52;i++){
      const gx = x-84+rnd()*168, gy = y+back+5+rnd()*70;
      ctx.fillStyle = i%3 ? 'rgba(255,255,255,.055)' : 'rgba(0,0,0,.11)';
      ctx.fillRect(gx, gy, 1.7, 1.3);
    }
    // tar seams
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
    for (let sy=y+back+16; sy<y+eave; sy+=18){
      ctx.beginPath(); ctx.moveTo(x-84,sy); ctx.lineTo(x+84,sy); ctx.stroke();
    }
    // shadow cast by the parapet onto the roof
    ctx.strokeStyle = 'rgba(0,0,0,.24)'; ctx.lineWidth = 5;
    rr(x-84, y+back+4, 168, 72, 2); ctx.stroke();
    // parapet cap
    ctx.strokeStyle = mixHex(lit, '#d2ccbe', .32); ctx.lineWidth = 6;
    rr(x-88, y+back, 176, 80, 3); ctx.stroke();
    ctx.strokeStyle = eaveC; ctx.lineWidth = 1.4; rr(x-91, y+back-3, 182, 86, 4); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 1;
    rr(x-85, y+back+3, 170, 74, 2); ctx.stroke();
    // skylight
    fr(x-70, y-46, 34, 20, 2, '#2c3a44');
    ctx.strokeStyle = '#151d23'; ctx.lineWidth = 1.6; rr(x-70,y-46,34,20,2); ctx.stroke();
    const sg = ctx.createLinearGradient(0,y-44,0,y-28);
    sg.addColorStop(0,'rgba(150,195,220,.30)'); sg.addColorStop(1,'rgba(90,130,155,.16)');
    ctx.fillStyle = sg; ctx.fillRect(x-67,y-43,28,14);
    ctx.strokeStyle = 'rgba(230,245,255,.20)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x-63,y-42); ctx.lineTo(x-55,y-31);
    ctx.moveTo(x-55,y-42); ctx.lineTo(x-47,y-31); ctx.stroke();
    // vent stack
    fr(x+12, y-50, 12, 12, 2, '#4c545a');
    ctx.fillStyle = '#6d767d'; ctx.fillRect(x+11, y-53, 14, 4);
    // water tank on a stand
    const tx = x+52, ty = y-35;
    ctx.strokeStyle = '#33383c'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(tx-13,ty+16); ctx.lineTo(tx-8,ty+5);
    ctx.moveTo(tx+13,ty+16); ctx.lineTo(tx+8,ty+5);
    ctx.moveTo(tx,ty+18); ctx.lineTo(tx,ty+6); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.20)';
    ctx.beginPath(); ctx.ellipse(tx+2, ty+16, 15, 4.5, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#596166';
    ctx.beginPath(); ctx.ellipse(tx,ty,10.5,9.4,0,0,6.3); ctx.fill();
    ctx.strokeStyle = '#363c40'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.strokeStyle = '#7c858a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(tx,ty,7.2,6.4,0,0,6.3); ctx.stroke();
    ctx.strokeStyle = 'rgba(20,24,26,.45)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(tx,ty+1.5,9.8,8.4,0,.15,3.0); ctx.stroke();
    ctx.fillStyle = '#8d979c'; ctx.beginPath(); ctx.ellipse(tx-2.6,ty-3.6,2.6,1.9,-.5,0,6.3); ctx.fill();
    ctx.fillStyle = '#2f3538'; ctx.beginPath(); ctx.ellipse(tx,ty-1,3.1,2.5,0,0,6.3); ctx.fill();
    ctx.fillStyle = '#454c50'; ctx.fillRect(tx+9, ty+2, 3, 12);
    // roof hatch
    fr(x-14, y-40, 24, 17, 2, '#4a5257');
    ctx.strokeStyle = '#2a3034'; ctx.lineWidth = 1.4; rr(x-14,y-40,24,17,2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x-11,y-38); ctx.lineTo(x+7,y-38); ctx.stroke();
    // maintenance ladder on the near corner
    ctx.strokeStyle = '#6e777c'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x-80,y+8); ctx.lineTo(x-80,y+25);
    ctx.moveTo(x-73,y+8); ctx.lineTo(x-73,y+25); ctx.stroke();
    ctx.lineWidth = 1.1;
    for (let ly=y+10; ly<y+25; ly+=4){
      ctx.beginPath(); ctx.moveTo(x-80,ly); ctx.lineTo(x-73,ly); ctx.stroke();
    }
  }

  /* shade under the front eave so the wall sits back */
  const eg = ctx.createLinearGradient(0, y+eave, 0, y+eave+12);
  eg.addColorStop(0,'rgba(0,0,0,.30)'); eg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = eg; ctx.fillRect(x-77, y+eave, 154, 12);

  /* chimney + smoke */
  if (style !== 2 && rnd() > .28){
    const chx = x + (rnd() < .5 ? -38 : 38), chy = y - 34;
    fr(chx-9, chy-8, 18, 17, 2, '#5a4a42');
    ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(chx-9,chy-2); ctx.lineTo(chx+9,chy-2);
    ctx.moveTo(chx-9,chy+4); ctx.lineTo(chx+9,chy+4); ctx.stroke();
    fr(chx-11, chy-10, 22, 4, 1, '#40332c');
    for (let k=0;k<3;k++){
      const ph = (S.t*.30 + k*.33) % 1;
      ctx.fillStyle = `rgba(225,225,218,${(1-ph)*.19})`;
      ctx.beginPath();
      ctx.arc(chx + Math.sin(S.t*.8 + k*2)*4 + ph*5, chy-14-ph*32, 4+ph*7, 0, 6.3);
      ctx.fill();
    }
  }

  /* biome dressing */
  if (bi === 'frozen'){
    ctx.fillStyle = 'rgba(240,250,255,.78)';
    ctx.beginPath(); ctx.ellipse(x, y+ridge-3, style===1?68:82, 4, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(240,250,255,.48)';
    for (let i=0;i<5;i++){
      ctx.beginPath();
      ctx.ellipse(x-58+rnd()*116, y-52+rnd()*48, 8+rnd()*13, 3+rnd()*2, 0, 0, 6.3);
      ctx.fill();
    }
    fr(x-88, y+eave-3, 176, 4, 2, 'rgba(240,250,255,.7)');
    ctx.fillStyle = 'rgba(200,232,248,.85)';
    for (let ix=x-78; ix<x+80; ix+=15){
      const h = 4 + rnd()*6;
      ctx.beginPath(); ctx.moveTo(ix-2, y+eave+2); ctx.lineTo(ix+2, y+eave+2);
      ctx.lineTo(ix, y+eave+2+h); ctx.closePath(); ctx.fill();
    }
  } else if (bi === 'swamp'){
    ctx.fillStyle = 'rgba(96,140,70,.26)';
    for (let i=0;i<4;i++){
      ctx.beginPath();
      ctx.ellipse(x-50+rnd()*100, y-50+rnd()*52, 9+rnd()*12, 4+rnd()*4, 0, 0, 6.3);
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(86,136,84,.62)'; ctx.lineWidth = 1.5;
    for (let ix=x-70; ix<x+72; ix+=19){
      ctx.beginPath(); ctx.moveTo(ix, y+eave);
      ctx.quadraticCurveTo(ix+2, y+eave+6, ix-1, y+eave+10); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(24,52,48,.42)';
    ctx.beginPath(); ctx.ellipse(x-78, y+72, 22, 8, 0, 0, 6.3); ctx.fill();
  } else if (bi === 'valley'){
    ctx.strokeStyle = '#5c7f44'; ctx.lineWidth = 1.4;
    for (let i=0;i<9;i++){
      const gx = x-70+i*17 + rnd()*5;
      ctx.beginPath(); ctx.moveTo(gx, y+54);
      ctx.quadraticCurveTo(gx-2, y+49, gx-4, y+47); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx, y+54);
      ctx.quadraticCurveTo(gx+3, y+50, gx+5, y+48); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(80,130,62,.20)';
    ctx.beginPath(); ctx.ellipse(x+52, y-44, 16, 7, 0, 0, 6.3); ctx.fill();
  } else if (bi === 'desert'){
    ctx.fillStyle = 'rgba(196,156,96,.34)';
    ctx.beginPath(); ctx.ellipse(x-72, y+54, 28, 8, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+74, y+64, 24, 7, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,230,170,.10)';
    ctx.beginPath(); ctx.moveTo(x-38,y+back); ctx.lineTo(x-18,y+back);
    ctx.lineTo(x+22,y+eave); ctx.lineTo(x+6,y+eave); ctx.closePath(); ctx.fill();
  } else if (bi === 'ash'){
    ctx.strokeStyle = 'rgba(20,16,15,.42)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x-58,y-52); ctx.lineTo(x+18,y+6); ctx.stroke();
    ctx.strokeStyle = 'rgba(20,16,15,.28)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x+46,y-46); ctx.lineTo(x+12,y-8); ctx.stroke();
    ctx.fillStyle = `rgba(255,110,40,${.14+Math.sin(S.t*4.5)*.05})`;
    ctx.fillRect(x-88, y+eave-2, 176, 3);
    ctx.fillStyle = 'rgba(96,84,80,.45)';
    ctx.beginPath(); ctx.ellipse(x-76, y+58, 18, 7, 0, 0, 6.3); ctx.fill();
  }

  /* yard clutter + lamp */
  if (rnd() > .42){
    const cx = x-72, cy = y+58;
    fr(cx-10, cy-8, 20, 16, 2, '#6b4e2e');
    ctx.strokeStyle = '#4a321c'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(cx-8,cy-6); ctx.lineTo(cx+8,cy+6);
    ctx.moveTo(cx+8,cy-6); ctx.lineTo(cx-8,cy+6); ctx.stroke();
  }
  if (rnd() > .30){
    const bx = x+70, by = y+60;
    ctx.fillStyle = '#5b4a37'; ctx.beginPath(); ctx.arc(bx,by,9,0,6.3); ctx.fill();
    ctx.strokeStyle = '#8a8f95'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(bx,by,6,0,6.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx,by,2.6,0,6.3); ctx.stroke();
  }
  if (rnd() > .35){
    const lx = x+82, ly = y+48;
    const gl = ctx.createRadialGradient(lx,ly,2,lx,ly,34);
    gl.addColorStop(0,'rgba(255,205,110,.22)'); gl.addColorStop(1,'rgba(255,205,110,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(lx,ly,34,0,6.3); ctx.fill();
    ctx.strokeStyle = '#2a2620'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(lx,ly+8); ctx.lineTo(lx,ly-2); ctx.stroke();
    ctx.fillStyle = '#ffdf94';
    ctx.beginPath(); ctx.arc(lx,ly-4,3.4,0,6.3); ctx.fill();
    ctx.strokeStyle = '#3a3228'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(lx,ly-4,4.5,0,6.3); ctx.stroke();
  }

  ctx.restore();
}

/* ---------- player ---------- */
function drawPlayer(x,y,dir,atkT){
  const p = S.player;
  const amp = clamp(p.walkAmp || 0, 0, 1), ph = p.walk || 0;
  const step = Math.sin(ph) * 2.6 * amp;
  const idle = Math.sin(S.t*2.1) * .3;
  const bob = amp > .02 ? Math.abs(Math.sin(ph)) * .9 * amp : idle;
  const hurt = Math.max(0, p.hurtT || 0);
  const jolt = hurt > 0 ? Math.sin(S.t*55) * 1.7 * hurt : 0;

  /* soft drop shadow */
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(x+3, y+8, 15.5, 6.6, 0, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(x+1.2, y+6.2, 9.6, 4.4, 0, 0, 6.3); ctx.fill();

  /* swing trail */
  if (atkT > .22){
    const k = clamp((atkT-.22)/.2, 0, 1);
    ctx.save();
    ctx.translate(x, y); ctx.rotate(dir);
    const g = ctx.createRadialGradient(0,0,15,0,0,35);
    g.addColorStop(0,'rgba(255,246,214,0)');
    g.addColorStop(.62,`rgba(255,246,214,${.13+k*.24})`);
    g.addColorStop(1,'rgba(255,255,240,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,35,-.95,.55);
    ctx.arc(0,0,15,.55,-.95,true); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = `rgba(255,252,232,${.22+k*.55})`;
    ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0,0,31.5,-.84,.42); ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(x+jolt, y-bob);
  ctx.rotate(dir + Math.PI/2);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  /* boots */
  const boot = (bx, ly)=>{
    ctx.fillStyle = '#3b4656';
    rr(bx-2.7, ly-2.4, 5.4, 6.6, 2.2); ctx.fill();
    ctx.fillStyle = '#222933';
    rr(bx-2.9, ly+3.0, 5.8, 5.6, 2.4); ctx.fill();
    ctx.strokeStyle = '#141920'; ctx.lineWidth = .9;
    rr(bx-2.9, ly+3.0, 5.8, 5.6, 2.4); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.13)';
    ctx.fillRect(bx-2.3, ly+4.2, 4.6, 1.1);
  };
  boot(-4.9, 6.2+step*.9);
  boot(4.9, 6.2-step*.9);

  /* long split coat */
  const sway = Math.sin(ph*2) * 2.2 * amp + idle;
  const coatPanel = side=>{
    ctx.beginPath();
    ctx.moveTo(side*9.3,-3.2);
    ctx.quadraticCurveTo(side*10.4, 3+side*sway*.15, side*7.2, 9.6+side*sway);
    ctx.quadraticCurveTo(side*4.2, 11.4+side*sway, side*1.5, 9.4+side*sway*.4);
    ctx.lineTo(side*1.1, 2);
    ctx.closePath();
  };
  ctx.fillStyle = '#33425c';
  coatPanel(-1); ctx.fill(); coatPanel(1); ctx.fill();
  ctx.strokeStyle = '#212d40'; ctx.lineWidth = 1.1;
  coatPanel(-1); ctx.stroke(); coatPanel(1); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(-7.4,3); ctx.lineTo(-5.4,8.6);
  ctx.moveTo(7.4,3); ctx.lineTo(5.4,8.6); ctx.stroke();

  /* torso + belt */
  ctx.fillStyle = '#3f5373';
  ctx.beginPath(); ctx.ellipse(0,-1.4, 8.6, 8.8, 0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = '#243149'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(168,200,238,.15)';
  ctx.beginPath(); ctx.ellipse(-2.6,-4, 3.2, 4.4, -.25, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#292c34'; ctx.fillRect(-7.4, 3.2, 14.8, 2.7);
  ctx.fillStyle = '#d0a24e'; ctx.fillRect(-1.4, 3.4, 2.8, 2.3);
  /* hip pouch */
  fr(-9.2, 1.2, 4.2, 4.8, 1.6, '#5d4630');
  ctx.strokeStyle = '#3b2b1a'; ctx.lineWidth = .9; rr(-9.2,1.2,4.2,4.8,1.6); ctx.stroke();

  /* backpack + bedroll */
  fr(-5.7, 0.4, 11.4, 8.4, 3, '#6f4e2d');
  ctx.strokeStyle = '#402c18'; ctx.lineWidth = 1.1; rr(-5.7,.4,11.4,8.4,3); ctx.stroke();
  fr(-4.9, 1.8, 9.8, 2.2, 1, '#8f6e45');
  fr(-4.9, 5.4, 9.8, 1.7, 1, '#573b21');
  ctx.strokeStyle = '#3f2b17'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(-4.1,.8); ctx.lineTo(-4.1,8.4);
  ctx.moveTo(4.1,.8); ctx.lineTo(4.1,8.4); ctx.stroke();
  ctx.fillStyle = '#c9a24a'; ctx.fillRect(-1.3, 8.5, 2.6, 1.3);
  fr(-6.6,-1.3, 13.2, 3.2, 1.6, '#6d7a45');
  ctx.strokeStyle = '#4a552f'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-3.7,-1.1); ctx.lineTo(-3.7,1.7);
  ctx.moveTo(3.7,-1.1); ctx.lineTo(3.7,1.7); ctx.stroke();
  ctx.fillStyle = 'rgba(196,214,150,.4)'; ctx.fillRect(-6.2,-.9, 12.4, 1.1);

  /* shoulders */
  for (const sd of [-1,1]){
    ctx.fillStyle = '#4a5f80';
    ctx.beginPath(); ctx.ellipse(sd*7.7,-2.6, 3.2, 3.3, 0, 0, 6.3); ctx.fill();
    ctx.strokeStyle = '#28354b'; ctx.lineWidth = 1.1; ctx.stroke();
  }

  /* left arm, fist up */
  ctx.strokeStyle = '#3a4b68'; ctx.lineWidth = 4.2;
  ctx.beginPath(); ctx.moveTo(-7.6,-2.4); ctx.quadraticCurveTo(-9.6,-5.2, -7.8,-8.4); ctx.stroke();
  ctx.fillStyle = '#4e3826';
  ctx.beginPath(); ctx.arc(-7.8,-8.4, 2.1, 0, 6.3); ctx.fill();
  ctx.strokeStyle = '#332416'; ctx.lineWidth = .8; ctx.stroke();

  /* right arm + scrap hammer */
  const swinging = atkT > .22;
  const armX = swinging ? 5.8 : 7.0, armY = swinging ? -7.4 : -6.2;
  ctx.strokeStyle = '#3a4b68'; ctx.lineWidth = 4.2;
  ctx.beginPath(); ctx.moveTo(7.6,-2.4); ctx.quadraticCurveTo(8.8,-4.4, armX,armY); ctx.stroke();
  ctx.fillStyle = '#4e3826';
  ctx.beginPath(); ctx.arc(armX,armY, 2.1, 0, 6.3); ctx.fill();
  ctx.strokeStyle = '#332416'; ctx.lineWidth = .8; ctx.stroke();

  const wAng = swinging ? lerp(-1.55, 1.0, clamp((0.42-atkT)/.2, 0, 1)) : .78;
  ctx.save();
  ctx.translate(armX, armY);
  ctx.rotate(wAng);
  ctx.strokeStyle = '#6a4a2c'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0,3.6); ctx.lineTo(0,-10.4); ctx.stroke();
  ctx.strokeStyle = 'rgba(230,190,130,.5)'; ctx.lineWidth = .9;
  ctx.beginPath(); ctx.moveTo(-.7,3); ctx.lineTo(-.7,-10.2); ctx.stroke();
  ctx.strokeStyle = '#3c2a18'; ctx.lineWidth = 1.2;
  for (let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(-1.4,-9+i*1.5); ctx.lineTo(1.4,-9+i*1.5); ctx.stroke(); }
  ctx.fillStyle = '#5d666f';
  ctx.beginPath();
  ctx.moveTo(-6.6,-18.4); ctx.lineTo(5.4,-18.4);
  ctx.lineTo(7.2,-16.6); ctx.lineTo(7.2,-13.4); ctx.lineTo(-6.6,-13.4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#2f353c'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#a9b6c4';
  ctx.beginPath(); ctx.moveTo(-6.6,-18.4); ctx.lineTo(5.4,-18.4);
  ctx.lineTo(7.2,-16.6); ctx.lineTo(-6.6,-17.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#39404a'; ctx.fillRect(-6.6,-15.4,13.8,1.4);
  ctx.fillStyle = '#c8d2dc'; ctx.fillRect(-6.6,-18.4,1.3,5);
  ctx.restore();

  /* scarf */
  const flap = Math.sin(S.t*3.2 + ph)*1.8;
  ctx.fillStyle = '#a5433a';
  ctx.beginPath(); ctx.moveTo(-5.2,-1.6);
  ctx.quadraticCurveTo(-9.6, 1.2+flap, -10.8, 5.4+flap);
  ctx.lineTo(-7.9, 4.6+flap);
  ctx.quadraticCurveTo(-7.1, 1.3, -4.4, .4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#b1463c'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-5.6,-2.6); ctx.quadraticCurveTo(0,-4.2, 5.6,-2.6); ctx.stroke();
  ctx.fillStyle = '#b1463c';
  ctx.beginPath(); ctx.arc(-4.7,-2.3, 1.9, 0, 6.3); ctx.fill();

  /* neck, cap and face */
  ctx.fillStyle = '#c99a72'; ctx.fillRect(-2.2,-4.6,4.4,3.4);
  ctx.fillStyle = '#2a3550';
  ctx.beginPath(); ctx.arc(0,-7.4, 6.0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = '#1c2438'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#e2b98f';
  ctx.beginPath(); ctx.ellipse(0,-6.9, 4.4, 4.6, 0, 0, 6.3); ctx.fill();
  ctx.strokeStyle = '#c79a70'; ctx.lineWidth = .8; ctx.stroke();
  ctx.fillStyle = 'rgba(120,84,60,.18)';
  ctx.beginPath(); ctx.arc(0,-4.5, 3.5, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#1e2740';
  ctx.beginPath(); ctx.ellipse(0,-11.2, 5.5, 2.4, 0, Math.PI, 6.3); ctx.fill();
  ctx.strokeStyle = '#141b2c'; ctx.lineWidth = .9; ctx.stroke();
  ctx.strokeStyle = 'rgba(160,190,225,.38)'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.arc(0,-7.4, 5.2, Math.PI*1.16, Math.PI*1.84); ctx.stroke();
  ctx.fillStyle = '#d9ae85';
  ctx.beginPath(); ctx.arc(-5.0,-6.6, 1.15, 0, 6.3); ctx.arc(5.0,-6.6, 1.15, 0, 6.3); ctx.fill();
  ctx.fillStyle = '#232a33';
  ctx.beginPath(); ctx.arc(-1.9,-8.7, 1.0, 0, 6.3); ctx.arc(1.9,-8.7, 1.0, 0, 6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,248,232,.6)';
  ctx.beginPath(); ctx.arc(-2.2,-9,.34,0,6.3); ctx.arc(1.6,-9,.34,0,6.3); ctx.fill();
  ctx.strokeStyle = 'rgba(70,48,36,.7)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-3.1,-10.1); ctx.lineTo(-1.2,-10.4);
  ctx.moveTo(3.1,-10.1); ctx.lineTo(1.2,-10.4); ctx.stroke();
  ctx.fillStyle = '#d0a077';
  ctx.beginPath(); ctx.arc(0,-7.4, .9, 0, 6.3); ctx.fill();
  ctx.strokeStyle = 'rgba(90,55,40,.55)'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.moveTo(-1.5,-6.1); ctx.lineTo(1.5,-6.1); ctx.stroke();
  ctx.restore();

  if (hurt > 0){
    ctx.fillStyle = `rgba(215,55,45,${hurt*.5})`;
    ctx.beginPath(); ctx.arc(x, y, 12.5, 0, 6.3); ctx.fill();
  }
}

/* ---------- infected ---------- */
function drawZombie(z){
  const sc = z.scale || 1, t = z.t, wob = Math.sin(t*2.2 + z.wob)*.10;
  const gait = Math.sin(t*7 + z.wob)*2.4;
  const lunge = Math.sin(t*4.5 + z.wob)*1.8;
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.beginPath(); ctx.ellipse(z.x+2, z.y+6, 11*sc, 5*sc, 0, 0, 6.3); ctx.fill();

  ctx.save();
  ctx.translate(z.x, z.y);
  ctx.rotate((z.ang || 0) + Math.PI/2 + wob);
  ctx.scale(sc, sc);
  ctx.lineCap = 'round';

  /* dragging feet */
  ctx.fillStyle = '#2d2822';
  rr(-6.0, 7.2+gait*.5, 5.2, 7.2, 2); ctx.fill();
  rr(0.8, 7.2-gait*.5, 5.2, 7.2, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.08)';
  ctx.fillRect(-5.5, 8.6+gait*.5, 4.2, 1);
  ctx.fillRect(1.3, 8.6-gait*.5, 4.2, 1);

  /* arms */
  const arm = (sx, ex, ey, bx, by)=>{
    ctx.strokeStyle = z.shirt; ctx.lineWidth = 4.2;
    ctx.beginPath(); ctx.moveTo(sx,-3); ctx.quadraticCurveTo(bx,by,ex,ey); ctx.stroke();
    ctx.fillStyle = z.skin;
    ctx.beginPath(); ctx.arc(ex,ey,2.2,0,6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(60,20,20,.5)'; ctx.lineWidth = .9;
    ctx.beginPath(); ctx.moveTo(ex-1,ey-1); ctx.lineTo(ex-2.4,ey-2.2); ctx.stroke();
  };
  if (z.v === 2){
    arm(-6.2, -8.4-lunge, -12.2, -9.2, -8.2);
    arm(6.2, 8.4+lunge, -12.2, 9.2, -8.2);
  } else if (z.v === 1){
    arm(-6.0, -3.8-lunge*.5, -14.2, -8.2, -9);
    arm(6.0, 3.8+lunge*.5, -14.2, 8.2, -9);
  } else {
    if (!z.arm) arm(-6.0, -8.6, 3.2, -9.2, -1.2);
    arm(6.0, 3.6+lunge*.6, -13.6, 8.4, -8.6);
  }

  /* torso: narrow, hunched, torn */
  ctx.fillStyle = z.shirt;
  ctx.beginPath(); ctx.ellipse(0,0.6,6.8,8.8,0,0,6.3); ctx.fill();
  ctx.strokeStyle = shade(z.shirt,-.38); ctx.lineWidth = 1.4; ctx.stroke();
  ctx.fillStyle = shade(z.shirt,.10);
  ctx.beginPath(); ctx.ellipse(-1.6,-3.6,4.2,3.2,-.3,0,6.3); ctx.fill();
  ctx.fillStyle = 'rgba(72,18,16,.40)';
  ctx.beginPath(); ctx.ellipse(2.2,1.8,2.4,3.2,0,0,6.3); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-3.2,-4.4,1.7,2.2,0,0,6.3); ctx.fill();
  if (z.v !== 2){
    ctx.strokeStyle = 'rgba(226,218,184,.40)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-3.7,-1.2); ctx.lineTo(3.2,-1.2);
    ctx.moveTo(-3.2,1.6); ctx.lineTo(2.8,1.6); ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(226,218,184,.28)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-4.2,-2); ctx.lineTo(3.6,-2);
    ctx.moveTo(-3.4,1.1); ctx.lineTo(3.4,1.1); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.10)';
    ctx.beginPath(); ctx.arc(-4.2,-5,2.2,0,6.3); ctx.fill();
  }
  /* ragged shirt hem */
  ctx.fillStyle = z.shirt;
  ctx.beginPath();
  ctx.moveTo(-6.2,6.2); ctx.lineTo(-4.6,10.2); ctx.lineTo(-2.6,7.4);
  ctx.lineTo(-0.6,10.6); ctx.lineTo(1.4,7.6); ctx.lineTo(3.4,10.2);
  ctx.lineTo(5.0,7.2); ctx.lineTo(6.4,9.0); ctx.lineTo(6.4,5.4);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = shade(z.shirt,-.38); ctx.lineWidth = 1.2; ctx.stroke();

  /* shoulders */
  for (const sd of [-1,1]){
    ctx.fillStyle = shade(z.shirt,.05);
    ctx.beginPath(); ctx.arc(sd*6.0,-3.2, 2.7, 0, 6.3); ctx.fill();
    ctx.strokeStyle = shade(z.shirt,-.34); ctx.lineWidth = 1; ctx.stroke();
  }

  /* wounds from recent hits */
  const wounds = (z.maxHp || 3) - z.hp;
  ctx.strokeStyle = 'rgba(120,24,20,.85)'; ctx.lineWidth = 1.6;
  for (let i=0;i<Math.min(3,wounds);i++){
    const wy = -3.4 + i*3.2;
    ctx.beginPath(); ctx.moveTo(-4.0,wy); ctx.lineTo(1.4,wy+1.8); ctx.stroke();
  }

  /* head */
  ctx.fillStyle = z.skin;
  ctx.beginPath(); ctx.arc(0,-9.8,5.9,0,6.3); ctx.fill();
  ctx.strokeStyle = shade(z.skin,-.36); ctx.lineWidth = 1.2; ctx.stroke();
  ctx.fillStyle = shade(z.skin,.08);
  ctx.beginPath(); ctx.ellipse(0,-12.6,3.4,2.6,0,0,6.3); ctx.fill();
  ctx.fillStyle = shade(z.skin,-.12);
  ctx.beginPath(); ctx.ellipse(0,-6.4,3.8,2.2,0,0,6.3); ctx.fill();
  ctx.fillStyle = '#2a1917';
  ctx.beginPath(); ctx.ellipse(0,-8.4,2.3,1.3,0,0,6.3); ctx.fill();
  ctx.fillStyle = '#d8d0b4';
  ctx.beginPath(); ctx.arc(-1.2,-8.4,.5,0,6.3); ctx.arc(1.1,-8.4,.5,0,6.3); ctx.fill();
  // sunken glowing eyes
  ctx.fillStyle = z.eye;
  ctx.beginPath(); ctx.arc(-2.05,-11.5,1.2,0,6.3); ctx.arc(2.05,-11.5,1.2,0,6.3); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,220,.72)';
  ctx.beginPath(); ctx.arc(-2.35,-11.8,.4,0,6.3); ctx.arc(1.75,-11.8,.4,0,6.3); ctx.fill();
  // straggly hair at the sides
  ctx.strokeStyle = '#2a221c'; ctx.lineWidth = 1.2;
  for (let i=0;i<4;i++){
    const sd = i%2 ? 1 : -1, yy = -7.4 - (i>>1)*2.4;
    ctx.beginPath(); ctx.moveTo(sd*4.6, yy);
    ctx.lineTo(sd*(6.8+Math.sin(t*3+i)*.8), yy-1.6); ctx.stroke();
  }
  // blood at the mouth
  ctx.fillStyle = 'rgba(130,24,20,.62)';
  ctx.beginPath(); ctx.arc(-1.5,-7.1,.8,0,6.3); ctx.arc(1.3,-6.9,.7,0,6.3); ctx.fill();

  if (z.flash > 0){
    ctx.globalAlpha = Math.min(1, z.flash*4);
    ctx.fillStyle = '#ffd9c0';
    ctx.beginPath(); ctx.arc(0,0,9.4,0,6.3); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if (z.hp < (z.maxHp || 3)){
    const bw = 18, bh = 2.6, by = z.y - 22*sc;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(z.x-bw/2, by, bw, bh);
    ctx.fillStyle = z.v === 2 ? '#ff7a5a' : '#cfe878';
    ctx.fillRect(z.x-bw/2, by, bw * Math.max(0, z.hp/(z.maxHp||3)), bh);
  }
}

function drawTender(y0, y1){
  fr(-21, y0, 42, y1-y0, 4, '#33383e');
  ctx.strokeStyle = '#22262a'; ctx.lineWidth = 2; rr(-21, y0, 42, y1-y0, 4); ctx.stroke();

  const fr_ = S.train.fuel / fuelMax();
  const heapH = 8 + fr_ * 30;
  ctx.fillStyle = '#171a1e';

  ctx.quadraticCurveTo(-8, y1-8-heapH, 0, y1-8-heapH*.7);

  if (fr_ > .15){ ctx.fillStyle = 'rgba(130,140,160,.4)';

function drawFinishGate(gy){

  for (let i=0;i<10;i++){

function drawTrain(){
  const t = S.train, L = trainLen();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(-28, t.y-8, 56, L+16);
  const ss = segs();
  ctx.fillStyle = '#14161a';
  for (let i=1;i<ss.length;i++) ctx.fillRect(-13, t.y+ss[i].y0-COUP, 26, COUP);
  if (hasPlow()) drawPlow(t.y);
  for (const s of ss){
    if (s.type==='loco') drawLoco(t.y);
    else if (s.type==='tender') drawTender(t.y+TENDER0, t.y+TENDER0+CART_LEN);
    else drawCart(s, t.y);
  }
  const rear = t.y + L - 5;
  ctx.fillStyle = 'rgba(255,70,60,.3)'; ctx.beginPath(); ctx.arc(0,rear,7,0,6.3); ctx.fill();
  ctx.fillStyle = '#ff5a4a'; ctx.beginPath(); ctx.arc(0,rear,3.2,0,6.3); ctx.fill();
  if (t.moving && t.fuel > 0){
    const fy = t.y - (hasPlow() ? 30 : 6);
    const g = ctx.createLinearGradient(0, fy, 0, fy-135);
    g.addColorStop(0,'rgba(255,236,180,.30)'); g.addColorStop(1,'rgba(255,236,180,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-16, fy); ctx.lineTo(16, fy);
    ctx.lineTo(30, fy-135); ctx.lineTo(-30, fy-135); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe9b0'; ctx.beginPath(); ctx.arc(0, fy-2, 3.6, 0, 6.3); ctx.fill();
  }
}

/* ---------- HUD sync ---------- */
const $ = id => document.getElementById(id);
let uiT = 0;
function uiSync(){
  if (S.t - uiT < .12) return; uiT = S.t;
  if (new URLSearchParams(location.search).has('probe'))
    document.title = `aboard=${S.player.aboard} ly=${S.player.ly|0} carts=${S.train.carts.map(c=>c.type).join(',')} ` +
      `fuel=${S.train.fuel|0}/${fuelMax()} inv=${JSON.stringify(S.inv)} mode=${S.mode}`;
  $('fuelF').style.width = (S.train.fuel/fuelMax()*100) + '%';
  $('fuelN').textContent = Math.ceil(S.train.fuel);
  $('hpF').style.width = S.player.hp + '%';
  $('hpN').textContent = Math.ceil(S.player.hp);
  $('dist').textContent = Math.floor(dist_m()) + ' / ' + GOAL_M + ' m';
  const bi = biomeIdxAt(S.train.y), B = BIOMES[bi];
  $('hudBiome').textContent = B.icon + ' ' + B.name;
  $('hudBiome').style.color = B.accent;
  $('hudNext').textContent = bi < BIOMES.length-1
    ? '→ ' + BIOMES[bi+1].icon + ' ' + Math.max(0, Math.ceil((bi+1)*BIOME_M - dist_m())) + ' m'
    : 'FINAL STRETCH';
  const i = S.inv;
  $('inv').innerHTML =
    `<span class="chip">🪵 ${i.wood}</span><span class="chip">⚫ ${i.coal}</span>`+
    `<span class="chip">⚙️ ${i.scrap}</span><span class="chip">🥫 ${i.food}</span>`+
    `<span class="chip">🚃 ${2 + S.train.carts.length}</span>`;
  $('bEat').querySelector('span').textContent = i.food;
  $('bEat').classList.toggle('off', i.food <= 0 || S.player.aboard);
  $('bTrain').querySelector('span').textContent =
    S.train.moving ? 'STOP' : (S.train.fuel > 0 ? (inCab() ? 'GO' : 'CAB') : 'NO FUEL');
  $('bTrain').classList.toggle('off', !S.player.aboard ||
    (!S.train.moving && (!inCab() || S.train.fuel <= 0)));
  $('bFuel').classList.toggle('off', !S.player.aboard || (S.inv.coal<=0 && S.inv.wood<=0));
  $('bBuild').classList.toggle('off', !canOpenBuild());
  const a = $('bAct');
  if (S.player.aboard){ a.querySelector('em').textContent='👇'; a.querySelector('span').textContent='GET OFF'; a.classList.remove('off'); }
  else if (canBoard()){ a.querySelector('em').textContent='🚂'; a.querySelector('span').textContent =
    S.train.moving ? 'JUMP ON' : 'BOARD'; a.classList.remove('off'); }
  else { a.querySelector('em').textContent='🔨'; a.querySelector('span').textContent='HIT'; a.classList.remove('off'); }
}

/* ---------- overlays ---------- */
function showOverlay(kind){
  const ov = $('ov'), c = $('ovCard');
  if (kind === 'title'){
    c.innerHTML = `<h1>IRON HAUL</h1>
      <p style="color:#f3c14b;font-weight:700">Drive the loot train to Station Aurora</p>
      <p>The train burns fuel as it rolls. <b>STOP</b>, hop off and forage
      coal · wood · food · scrap. The infected wait at every depot — and debris
      on the rails batters your fuel tank unless you fit a plow.</p>
      <p>Walk around your train <b>even while it rolls</b>. Open <b>BUILD</b> to
      bolt on your workshop (you start with the parts). Then stand inside it to
      add cars: plow, bunker, greenhouse, turret, infirmary.</p>
      <p>You can <b>JUMP ON</b> a moving train from beside the rails.</p>
      <p>Cross <b>five biomes</b> — 🌲 valley, 🌵 badlands, ❄️ ice, 🌿 mire,
      🔥 ash — and reach <b>Station Aurora at ${GOAL_M} m</b> alive.</p>
      <button id="go">START THE ENGINE</button>
      <div class="keys">MOBILE: left-thumb joystick · buttons on the right<br>
      DESKTOP: WASD move · SPACE act · F fuel · E eat · T train · B build</div>`;
  } else if (kind === 'win'){
    c.innerHTML = `<h2 style="color:#f3c14b">🚂 STATION AURORA!</h2>
      <div class="big">🎉</div>
      <div class="stat"><span>Distance</span><b>${Math.floor(dist_m())} m</b></div>
      <div class="stat"><span>Cars in the consist</span><b>${2 + S.train.carts.length}</b></div>
      <div class="stat"><span>Wood</span><b>${S.inv.wood}</b></div>
      <div class="stat"><span>Coal</span><b>${S.inv.coal}</b></div>
      <div class="stat"><span>Scrap</span><b>${S.inv.scrap}</b></div>
      <div class="stat"><span>Health</span><b>${Math.round(S.player.hp)}</b></div>
      <button id="go" style="margin-top:14px">RUN IT AGAIN</button>`;
  } else if (kind === 'dead'){
    c.innerHTML = `<h2 style="color:#ef6a5a">☠ YOU DIED</h2>
      <div class="big">💀</div>
      <div class="stat"><span>Reached</span><b>${Math.floor(dist_m())} / ${GOAL_M} m</b></div>
      <div class="stat"><span>Scrap hauled</span><b>${S.inv.scrap}</b></div>
      <div class="stat"><span>Cars built</span><b>${S.train.carts.length}</b></div>
      <button id="go" style="margin-top:14px">TRY AGAIN</button>`;
  }
  closeBuild();
  document.getElementById('bioBanner')?.classList.remove('show'); S.biomeT = 0;
  const _t = document.getElementById('toast');
  if (_t){ _t.style.opacity = 0; } S.toastT = 0;
  ov.classList.remove('hide');
  $('go').onclick = () => { reset(); ov.classList.add('hide'); };
}
function reset(){
  S.mode = 'play'; S.t = 0; S.paused = false; S.lowFuel = false;
  S.train = { y: 0, moving: true, fuel: 55, carts: [] };
  S.inv = { wood: 6, coal: 2, scrap: 4, food: 1 };
  S.player = { x: 0, y: 120, lx: 0, ly: 120, aboard: true, hp: 100,
               dir: -Math.PI/2, atkT: 0, hurtT: 0, walk: 0, walkAmp: 0 };
  S.cam = { x: 0, y: 0 }; S.focusF = .6;
  S.zombies = []; S.parts = []; S.texts = []; S.smoke = []; S.beams = [];
  S.amb = []; S.biomeIdx = 0; S.biomeT = 0;
  document.getElementById('bioBanner')?.classList.remove('show');
  S.joy.active = false; S.joy.dx = S.joy.dy = 0; S.keys = {};
  S.hitFlash = 0; S.shake = 0; S.toastT = 0;
  for (const [, list] of chunks) for (const p of list){ delete p.taken; delete p.thud; delete p.warn; }
  closeBuild(); uiT = -1; uiSync();
  toast('Rolling! Open BUILD to bolt on your workshop');
}

/* ---------- input ---------- */
function act(x,y){
  if (S.mode !== 'play') return;
  if (S.paused){ if (y === 'build') toggleBuild(); return; }
  if (y === 'train') doTrain(); else if (y === 'fuel') doFuel();
  else if (y === 'eat') doEat(); else if (y === 'build') toggleBuild();
  else doAct();
}
$('bTrain').addEventListener('pointerdown', e => { e.preventDefault(); act(0,'train'); });
$('bFuel').addEventListener('pointerdown', e => { e.preventDefault(); act(0,'fuel'); });
$('bBuild').addEventListener('pointerdown', e => { e.preventDefault(); act(0,'build'); });
$('bEat').addEventListener('pointerdown', e => { e.preventDefault(); act(0,'eat'); });
$('bAct').addEventListener('pointerdown', e => { e.preventDefault(); act(0,'act'); });

cv.addEventListener('pointerdown', e => {
  if (e.clientX < W * 0.62 && S.mode === 'play' && !S.paused){
    S.joy.active = true; S.joy.id = e.pointerId;
    S.joy.bx = e.clientX; S.joy.by = e.clientY; S.joy.dx = 0; S.joy.dy = 0;
    cv.setPointerCapture(e.pointerId);
  }
});
cv.addEventListener('pointermove', e => {
  if (S.joy.active && e.pointerId === S.joy.id){
    let dx = e.clientX - S.joy.bx, dy = e.clientY - S.joy.by;
    const d = Math.hypot(dx,dy), max = 52;
    if (d > max){ dx = dx/d*max; dy = dy/d*max; }
    S.joy.dx = dx/max; S.joy.dy = dy/max;
  }
});
function joyEnd(e){ if (S.joy.active && e.pointerId === S.joy.id){
  S.joy.active = false; S.joy.dx = 0; S.joy.dy = 0; } }
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);

window.addEventListener('keydown', e => {
  S.keys[e.key] = true;
  if (e.key.startsWith('Arrow')) e.preventDefault();
  if (S.mode !== 'play'){ if (e.key===' '||e.key==='Enter') $('go')?.click(); return; }
  if (e.key === 'Escape' && S.paused){ closeBuild(); return; }
  if (e.key === ' ') { e.preventDefault(); act(0,'act'); }
  if (e.key === 'f' || e.key === 'F') act(0,'fuel');
  if (e.key === 'e' || e.key === 'E') act(0,'eat');
  if (e.key === 't' || e.key === 'T') act(0,'train');
  if (e.key === 'b' || e.key === 'B') act(0,'build');
});
window.addEventListener('keyup', e => S.keys[e.key] = false);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
cv.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- debug hooks for automated screenshots ---------- */
const q = new URLSearchParams(location.search);
if (q.has('shot')){
  S.mode = 'play';
  if (q.get('shot') === 'off'){
    S.train.moving = false; S.player.aboard = false; S.player.x = 120; S.player.y = -240;
    S.train.fuel = 40; S.inv = { wood:2, coal:1, scrap:1, food:2 };
  } else if (q.get('shot') === 'zom'){
    S.train.moving = false; S.player.aboard = false; S.player.x = 150; S.player.y = -260;
    spawnZs({ x: 90, y: -300, n: 4 });
  } else if (q.get('shot') === 'zom2'){
    S.train.moving = false; S.player.aboard = false; S.player.x = 200; S.player.y = -620;
    spawnZs({ x: 60, y: -300, n: 5 });
  } else if (q.get('shot') === 'deck'){
    S.train.moving = true;
    for (const ty of ['workshop','bunker','green','turret','medic'])
      S.train.carts.push({ type:ty, store: ty==='green'?2:0, t: ty==='green'?9:0, cool:0, aim:-Math.PI/2 });
    S.player.aboard = true; S.player.lx = 6; S.player.ly = 330;
    S.inv = { wood:3, coal:2, scrap:4, food:1 }; S.train.fuel = 70;
  } else if (q.get('shot') === 'build'){
    S.train.moving = false;
    S.train.carts.push({ type:'workshop', store:0, t:0, cool:0, aim:-Math.PI/2 });
    S.player.aboard = true; S.player.lx = 0; S.player.ly = TENDER0 + CART_LEN + COUP + 30;
    S.inv = { wood:9, coal:3, scrap:7, food:2 };
    openBuild();
  } else if (q.get('shot') === 'plow'){
    S.train.moving = true;
    S.train.carts.push({ type:'plow', store:0, t:0, cool:0, aim:-Math.PI/2 });
    const cl = genChunk(-2);
    cl.push({ type:'debris', kind:'log', x:0, y:-700, hp:2, amt:2 });
    S.train.fuel = 80;
  } else if (q.get('shot') === 'biome'){
    const m = parseFloat(q.get('m') || '500');
    S.train.y = -m*PPM; S.train.moving = false; S.train.fuel = 70;
    S.player.aboard = true; S.player.lx = 0; S.player.ly = 120;
    S.cam.y = S.train.y + 120; S.cam.x = 0;
    S.inv = { wood:9, coal:4, scrap:8, food:3 };
    S.biomeIdx = biomeIdxAt(S.train.y);
  } else if (q.get('shot') === 'win'){
    S.train.y = -GOAL_M*PPM - 5;
    for (const t of ['workshop','plow','turret']) S.train.carts.push({ type:t, store:0, t:0, cool:0, aim:-Math.PI/2 });
    S.inv.scrap = 23; S.player.hp = 72;
    S.mode='win'; showOverlay('win');
  } else if (q.get('shot') === 'dead'){
    S.train.y = -1370*PPM;
    for (const t of ['workshop','green']) S.train.carts.push({ type:t, store:0, t:0, cool:0, aim:-Math.PI/2 });
    S.inv.scrap = 9; damage(120);
  }
  else { S.player.aboard = true; S.player.lx = 0; S.player.ly = 120; }
  const n = parseInt(q.get('sim') || '90', 10);
  for (let i = 0; i < n; i++) { try { update(1/60); } catch(e){} }
}

/* ---------- boot ---------- */
if (!q.has('shot')) showOverlay('title');
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  try { if (S.mode === 'play' && !S.paused) update(dt); else if (S.mode !== 'play') S.t += dt; }
  catch (err) { document.title = 'ERR-U: ' + err.message + ' @ ' + (err.stack||'').split('\n')[1]; }
  try { draw(); }
  catch (err) { document.title = 'ERR-D: ' + err.message + ' @ ' + (err.stack||'').split('\n')[1]; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
