<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>IRON HAUL — Top-Down Train Survival</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23162018'/%3E%3Ctext x='32' y='46' font-size='42' text-anchor='middle'%3E%F0%9F%9A%82%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;position:fixed;background:#0c120c;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
  #cv{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
  /* ---------- HUD ---------- */
  #hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;pointer-events:none;z-index:5}
  #bars{display:flex;gap:8px;align-items:center}
  .bar{flex:1;display:flex;align-items:center;gap:5px;background:rgba(10,14,10,.62);border:1px solid #2c3a2c;
    border-radius:20px;padding:4px 9px;height:26px}
  .bar i{font-style:normal;font-size:12px;flex:none}
  .bar .t{flex:1;height:8px;background:#141a14;border-radius:6px;overflow:hidden}
  .bar .f{height:100%;width:100%;border-radius:6px;transition:width .18s}
  .bar b{font-size:9px;font-weight:800;color:#c9c2a8;min-width:20px;text-align:right;flex:none}
  #fuelF{background:linear-gradient(90deg,#e0a63a,#f7d070)}
  #hpF{background:linear-gradient(90deg,#c93b3b,#ef6a5a)}
  #dist{flex:none;font-weight:800;font-size:12px;color:#ffe9b0;background:rgba(10,14,10,.62);
    border:1px solid #2c3a2c;border-radius:20px;padding:5px 11px;white-space:nowrap}
  #inv{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:700;color:#e8e0c8;background:rgba(10,14,10,.62);border:1px solid #2c3a2c;
    border-radius:12px;padding:3px 8px}
  #biomeHud{margin-top:5px;display:flex;gap:7px;align-items:center;font-size:9.5px;font-weight:800;
    letter-spacing:.6px;color:#9aa288;text-shadow:0 1px 2px #000}
  #hudBiome{color:#ffe9b0;background:rgba(10,14,10,.62);border:1px solid #2c3a2c;border-radius:12px;
    padding:2px 8px;white-space:nowrap}
  #hudNext{white-space:nowrap}
  #bioBanner{position:fixed;left:50%;top:30%;transform:translate(-50%,-10px);z-index:8;pointer-events:none;
    display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;
    transition:opacity .55s ease,transform .55s ease;text-align:center;
    background:rgba(8,12,8,.6);border:1px solid rgba(243,193,75,.4);border-radius:16px;
    padding:10px 22px;backdrop-filter:blur(4px)}
  #bioBanner.show{opacity:1;transform:translate(-50%,0)}
  #bioIcon{font-size:24px;line-height:1.1}
  #bioTitle{font-size:15px;font-weight:900;letter-spacing:2.5px;color:#ffe9b0}
  #bioSub{font-size:8.5px;font-weight:800;letter-spacing:1.4px;color:#9aa288}
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 92px);transform:translateX(-50%);
    background:rgba(12,16,12,.85);border:1px solid #3c4a3c;color:#ffe9b0;font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:14px;opacity:0;transition:opacity .25s;z-index:9;pointer-events:none;
    max-width:80vw;text-align:center}
  /* ---------- Buttons ---------- */
  #btns{position:fixed;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:6;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .row{display:flex;gap:8px}
  .gbtn{border:2px solid #46543f;border-radius:50%;background:rgba(22,30,20,.88);color:#efe8d0;
    font-weight:800;letter-spacing:.3px;box-shadow:0 4px 12px rgba(0,0,0,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
    font-family:inherit;touch-action:manipulation}
  .gbtn:active{transform:scale(.93);background:rgba(40,52,36,.95)}
  .gbtn.off{opacity:.35;filter:grayscale(.7)}
  .gbtn em{font-style:normal;font-size:18px}
  .gbtn span{font-size:9px;margin-top:2px}
  #bTrain{width:62px;height:62px}
  #bFuel{width:56px;height:56px}
  #bBuild{width:56px;height:56px}
  #bEat{width:56px;height:56px}
  #bAct{width:92px;height:92px;background:rgba(150,60,32,.9);border-color:#c9a06a}
  #bAct em{font-size:26px}
  #bAct span{font-size:11px}
  /* ---------- Overlays ---------- */
  #ov,#bmodal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:rgba(6,9,6,.82);backdrop-filter:blur(3px)}
  #bmodal{z-index:18;background:rgba(6,9,6,.55)}
  #ov.hide,#bmodal.hide{display:none}
  .card{width:min(86vw,370px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;background:#141b13;
    border:2px solid #46543f;border-radius:22px;
    padding:22px 20px;text-align:center;color:#efe8d0;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .card h1{font-size:26px;letter-spacing:2px;color:#f3c14b;margin-bottom:4px}
  .card h2{font-size:20px;letter-spacing:1px;margin-bottom:6px}
  .card p{font-size:13px;line-height:1.55;color:#c9c2a8;margin:8px 0 14px}
  .card .big{font-size:34px;margin:6px 0}
  .stat{display:flex;justify-content:space-between;font-size:13px;color:#c9c2a8;
    border-top:1px dashed #3c4a3c;padding:6px 2px}
  .stat b{color:#ffe9b0}
  #go{width:100%;padding:14px;border:0;border-radius:14px;background:#e8a13c;color:#241a08;
    font-size:17px;font-weight:900;letter-spacing:1px;font-family:inherit}
  #go:active{transform:scale(.97)}
  .keys{font-size:10px;color:#7d8a72;margin-top:10px}
  @media (max-height:620px){
    .card{padding:14px 16px}
    .card h1{font-size:20px}
    .card h2{font-size:17px}
    .card p{font-size:11px;line-height:1.4;margin:5px 0 8px}
    .card .stat{padding:4px 2px;font-size:12px}
    .card .big{font-size:26px;margin:2px 0}
    #go{padding:10px;font-size:15px}
    .keys{display:none}
  }
  /* ---------- Build modal ---------- */
  .build{padding:14px 14px 16px;max-height:min(88vh,660px);max-height:min(88dvh,660px);display:flex;flex-direction:column}
  .bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .bh h2{margin:0}
  #bclose{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid #46543f;background:#1c241a;
    color:#efe8d0;font-size:15px;font-weight:800;font-family:inherit}
  #blist{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding-right:2px}
  #blist.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 30px), transparent);
    mask-image:linear-gradient(#000 calc(100% - 30px), transparent)}
  #bnote{font-size:10.5px;line-height:1.4;color:#c9c2a8;background:#10160f;border:1px solid #2c3a2c;
    border-radius:10px;padding:7px 9px;margin-bottom:8px;text-align:left}
  #bnote.hide{display:none}
  .bitem{display:flex;align-items:center;gap:10px;background:#1a2318;border:1px solid #2c3a2c;
    border-radius:14px;padding:9px 10px;text-align:left}
  .bitem .ic{width:38px;height:38px;flex:none;border-radius:10px;background:#10160f;border:1px solid #2c3a2c;
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .bitem .info{flex:1;min-width:0}
  .bitem b{font-size:12.5px;color:#ffe9b0;letter-spacing:.4px}
  .bitem small{display:block;font-size:10.5px;color:#9aa288;margin-top:1px;line-height:1.3}
  .cost{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
  .cost i{font-style:normal;font-size:10px;font-weight:800;border-radius:8px;padding:2px 6px;
    background:#10160f;border:1px solid #2c3a2c;color:#e8e0c8}
  .cost i.no{color:#ef6a5a;border-color:#6a3a34}
  .bdo{flex:none;width:58px;padding:9px 0;border:0;border-radius:10px;background:#e8a13c;color:#241a08;
    font-size:11px;font-weight:900;font-family:inherit}
  .bdo:active{transform:scale(.95)}
  .bdo.off{opacity:.35}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud">
  <div id="bars">
    <div class="bar"><i>⛽</i><div class="t"><div class="f" id="fuelF"></div></div><b id="fuelN">0</b></div>
    <div class="bar"><i>❤️</i><div class="t"><div class="f" id="hpF"></div></div><b id="hpN">0</b></div>
    <div id="dist">0 / 5000 m</div>
  </div>
  <div id="inv"></div>
  <div id="biomeHud"><span id="hudBiome">🌲 GREEN VALLEY</span><span id="hudNext">→ 1000 m</span></div>
</div>
<div id="toast"></div>
<div id="bioBanner"><span id="bioIcon">🌲</span><span id="bioTitle">GREEN VALLEY</span><span id="bioSub"></span></div>

<div id="btns">
  <button class="gbtn" id="bTrain"><em>🚂</em><span>STOP</span></button>
  <div class="row">
    <button class="gbtn" id="bFuel"><em>⛽</em><span>FUEL</span></button>
    <button class="gbtn" id="bBuild"><em>🔧</em><span>BUILD</span></button>
    <button class="gbtn" id="bEat"><em>🥫</em><span>0</span></button>
  </div>
  <button class="gbtn" id="bAct"><em>👇</em><span>GET OFF</span></button>
</div>

<div id="bmodal" class="hide"><div class="card build">
  <div class="bh"><h2>🔧 WORKSHOP</h2><button id="bclose">✕</button></div>
  <div id="bnote" class="hide"></div>
  <div id="blist"></div>
</div></div>

<div id="ov" class="hide"><div class="card" id="ovCard"></div></div>
<script>
"use strict";
/* =========================================================
   IRON HAUL v2 — mobile top-down train survival (single file)
   World: +x east, +y south. Train drives NORTH (y decreases).
   10 px = 1 meter. Goal: reach 5000 m through five blended biomes.
   v2: cart building, on-deck walking, per-cart functions.
   ========================================================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
window.addEventListener('resize', resize); resize();

/* ---------- constants ---------- */
const PPM = 10, GOAL_M = 5000;
const TRAIN_SPD = 105, FUEL_DRAIN = 1.5, PLAYER_SPD = 170;
const CHUNK = 420;
const LOCO_LEN = 150, CART_LEN = 62, COUP = 10, TENDER0 = 160;
const BIOME_M = 1000, BIOME_W = 150;

/* ---------- cart catalogue ---------- */
const CART_DEFS = {
  workshop: { name:'WORKSHOP',   icon:'🔧', cost:{ wood:6, scrap:4 },            desc:'Mobile workshop. Stand inside to build more cars.' },
  plow:     { name:'COW PLOW',   icon:'🔱', cost:{ wood:8, scrap:6 },            desc:'Front wedge — smashes debris on the rails.' },
  bunker:   { name:'COAL BUNKER',icon:'⚫', cost:{ wood:5, coal:2, scrap:4 },    desc:'+40 max fuel capacity.' },
  green:    { name:'GREENHOUSE', icon:'🌱', cost:{ wood:8, scrap:2, food:1 },    desc:'Grows food while the train is rolling.' },
  turret:   { name:'TURRET',     icon:'🔫', cost:{ wood:4, coal:2, scrap:8 },    desc:'Auto-fires at infected near the train.' },
  medic:    { name:'INFIRMARY',  icon:'⛑️', cost:{ wood:6, scrap:4, food:2 },    desc:'Heals you while you stand on it.' },
};

/* ---------- biomes ---------- */
const BIOMES = [
  { id:'valley', name:'GREEN VALLEY', icon:'🌲',
    ground:[34,47,28], bed:[45,42,34], tie:[35,30,24],
    grass:'#3e5a30', trunk:'#4a3a26', crown:'#376831', crown2:'#2f5a2a',
    rock:'#565a5e', patch:[[44,60,32,.55],[52,68,36,.45]],
    depot:'#6b5a44', roof:'#4f3d2a', roofLit:'#7d6343', roofDark:'#31251a', accent:'#b8e0a0', wash:[40,90,40,.035] },
  { id:'desert', name:'SUNSCORCHED BADLANDS', icon:'🌵',
    ground:[84,61,36], bed:[70,53,35], tie:[48,37,26],
    grass:'#9c8450', trunk:'#6b4a2e', crown:'#8a7a4a', crown2:'#6b5e38',
    rock:'#8d6a46', patch:[[112,82,46,.45],[96,70,40,.5]],
    depot:'#8a6a44', roof:'#6b4b30', roofLit:'#a17549', roofDark:'#432c1b', accent:'#f0c27a', wash:[255,160,60,.055] },
  { id:'frozen', name:'FROZEN EXPANSE', icon:'❄️',
    ground:[58,76,90], bed:[54,66,76], tie:[44,52,60],
    grass:'#a8c8d6', trunk:'#4a4038', crown:'#2d5a50', crown2:'#dfeaf0',
    rock:'#93aab8', patch:[[150,172,186,.34],[122,146,164,.30]],
    depot:'#5a6a72', roof:'#3d5059', roofLit:'#667e8a', roofDark:'#243139', accent:'#cfeaf7', wash:[160,210,255,.075] },
  { id:'swamp', name:'BLACKWATER MIRE', icon:'🌿',
    ground:[28,50,42], bed:[41,46,38], tie:[31,34,28],
    grass:'#4a7a5a', trunk:'#3e4a32', crown:'#4f7040', crown2:'#6a8a52',
    rock:'#4a5a50', patch:[[34,64,54,.55],[44,78,62,.45]],
    depot:'#4a5a48', roof:'#37452f', roofLit:'#54683e', roofDark:'#212c1c', accent:'#8fd3a8', wash:[50,170,120,.05] },
  { id:'ash', name:'ASHEN WASTES', icon:'🔥',
    ground:[42,35,35], bed:[46,39,37], tie:[32,28,27],
    grass:'#6a5050', trunk:'#3a2e2c', crown:'#4a3a38', crown2:'#2a2220',
    rock:'#4a4040', patch:[[58,44,42,.55],[76,50,46,.42]],
    depot:'#4a3a36', roof:'#382f2d', roofLit:'#5b4a43', roofDark:'#241c1a', accent:'#ff9a5a', wash:[255,80,30,.06] },
];
function smoothstep(t){ t = clamp(t,0,1); return t*t*(3-2*t); }
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function biomeMix(y){
  const m = clamp(-y/PPM, 0, GOAL_M);
  for (let b = 1; b < BIOMES.length; b++){
    const edge = b*BIOME_M;
    if (m > edge - BIOME_W/2 && m < edge + BIOME_W/2)
      return { a:b-1, b, t:smoothstep((m - (edge - BIOME_W/2)) / BIOME_W) };
  }
  return { a:clamp(Math.floor(m/BIOME_M),0,BIOMES.length-1), b:0, t:0 };
}
function biomeIdxAt(y){ const m = biomeMix(y); return m.t >= .5 ? m.b : m.a; }
function pickBiomeIdx(y, rnd){
  const m = biomeMix(y);
  return (m.t > 0 && rnd() < m.t) ? m.b : m.a;
}
function biomeRgbAt(y){
  const m = biomeMix(y);
  return m.t ? mix3(BIOMES[m.a].ground, BIOMES[m.b].ground, m.t) : BIOMES[m.a].ground;
}
function biomeWashAt(y){
  const m = biomeMix(y), A = BIOMES[m.a].wash, B = BIOMES[m.b].wash, t = m.t;
  return [A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t, A[3]+(B[3]-A[3])*t];
}
function rgbCss(c,a){ return a === undefined
  ? `rgb(${c[0]|0},${c[1]|0},${c[2]|0})` : `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }

/* ---------- state ---------- */
const S = {
  mode: 'title', t: 0,
  train: { y: 0, moving: true, fuel: 55, carts: [] },
  inv: { wood: 6, coal: 2, scrap: 4, food: 1 },
  player: { x: 0, y: 120, lx: 0, ly: 120, aboard: true, hp: 100,
            dir: -Math.PI/2, atkT: 0, hurtT: 0, walk: 0, walkAmp: 0 },
  cam: { x: 0, y: 0 }, focusF: .6,
  zombies: [], parts: [], texts: [], smoke: [], beams: [],
  amb: [], biomeIdx: 0, biomeT: 0,
  joy: { active: false, id: -1, bx: 0, by: 0, dx: 0, dy: 0 },
  keys: {},
  hitFlash: 0, shake: 0, toastT: 0,
  paused: false, lowFuel: false,
};
const dist_m = () => Math.max(0, -S.train.y / PPM);

/* ---------- train geometry ---------- */
function trainLen(){ return TENDER0 + CART_LEN + (CART_LEN + COUP) * S.train.carts.length; }
function segs(){
  const out = [{ type:'loco', y0:0, y1:LOCO_LEN }];
  out.push({ type:'tender', y0:TENDER0, y1:TENDER0 + CART_LEN });
  let off = TENDER0 + CART_LEN + COUP;
  for (const c of S.train.carts){ out.push({ type:c.type, y0:off, y1:off+CART_LEN, ref:c }); off += CART_LEN + COUP; }
  return out;
}
function nCarts(type){ return S.train.carts.filter(c => c.type === type).length; }
const hasPlow = () => nCarts('plow') > 0;
function fuelMax(){ return 100 + 40 * nCarts('bunker'); }
function zoneAt(ly){
  const t = S.train;
  if (ly >= 0 && ly < LOCO_LEN) return { type:'loco', y0:0, y1:LOCO_LEN };
  if (ly >= TENDER0 && ly < TENDER0 + CART_LEN) return { type:'tender', y0:TENDER0, y1:TENDER0+CART_LEN };
  let off = TENDER0 + CART_LEN + COUP;
  for (const c of t.carts){
    if (ly >= off && ly < off + CART_LEN) return { type:c.type, y0:off, y1:off+CART_LEN, ref:c };
    off += CART_LEN + COUP;
  }
  return null;
}
const inCab = () => S.player.aboard && S.player.ly >= 96 && S.player.ly < LOCO_LEN;
function inZone(type){
  if (!S.player.aboard) return false;
  const z = zoneAt(S.player.ly);
  return !!(z && z.type === type);
}
function canOpenBuild(){
  // The first workshop must be constructible before there is a workshop to stand in.
  return S.player.aboard && (nCarts('workshop') === 0 || inZone('workshop'));
}
function canBuildType(type){
  if (!S.player.aboard) return false;
  if (type === 'workshop') return nCarts('workshop') === 0;
  if (nCarts('workshop') === 0) return false;
  return inZone('workshop');
}

/* ---------- utils ---------- */
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,k)=>a+(b-a)*k;
function mixHex(a, b, k){
  const na = parseInt(a.slice(1),16), nb = parseInt(b.slice(1),16);
  const ch = (n,s)=> (n>>s)&255;
  const r = Math.round(ch(na,16)+(ch(nb,16)-ch(na,16))*k);
  const g = Math.round(ch(na,8)+(ch(nb,8)-ch(na,8))*k);
  const bl = Math.round(ch(na,0)+(ch(nb,0)-ch(na,0))*k);
  return `rgb(${r},${g},${bl})`;
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  const r = Math.round(((n>>16)&255) + (t-((n>>16)&255))*p);
  const g = Math.round(((n>>8)&255) + (t-((n>>8)&255))*p);
  const b = Math.round((n&255) + (t-(n&255))*p);
  return `rgb(${r},${g},${b})`;
}
function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg;
  el.style.opacity=1; S.toastT=1.6; }
function puff(x,y,c,n=6,spd=60){ for(let i=0;i<n;i++){const a=Math.random()*6.28,s=spd*(.4+Math.random()*.8);
  S.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5+Math.random()*.4,c:typeof c==='string'?c:c()}); } }
function addText(x,y,txt,c){ S.texts.push({x,y,txt,c,t:1}); }

/* ---------- biome atmosphere ---------- */
function showBiomeBanner(i){
  const el = document.getElementById('bioBanner');
  if (!el) return;
  document.getElementById('bioIcon').textContent = BIOMES[i].icon;
  document.getElementById('bioTitle').textContent = BIOMES[i].name;
  document.getElementById('bioSub').textContent =
    'BIOME ' + (i+1) + ' OF ' + BIOMES.length + '  ·  ' + (i*BIOME_M) + ' m';
  el.classList.add('show');
  S.biomeT = 3.6;
}
function ambientUpdate(dt){
  const bi = biomeIdxAt(S.cam.y);
  const rate = [9, 16, 52, 12, 26][bi];
  if (S.amb.length < 150 && Math.random() < rate*dt){
    const p = { bi, t:2+Math.random()*2.4, r:1.2+Math.random()*2, wob:Math.random()*6.28 };
    p.tt = p.t;
    p.x = S.cam.x + (Math.random()*2-1)*W*0.8;
    p.y = S.cam.y + (Math.random()*2-1)*H*0.65;
    if (bi === 2){ // snow falls from above
      p.y = S.cam.y - H*0.62;
      p.vx = -6 + Math.random()*12; p.vy = 45 + Math.random()*50;
      p.c = 'rgba(232,246,255,.88)';
    } else if (bi === 1){ // desert dust
      p.vx = 36 + Math.random()*46; p.vy = -6 + Math.random()*18;
      p.c = 'rgba(226,196,138,.5)';
    } else if (bi === 4){ // rising embers
      p.y = S.cam.y + H*0.45 + Math.random()*H*0.2;
      p.vx = -12 + Math.random()*24; p.vy = -30 - Math.random()*40;
      p.c = 'rgba(255,140,60,.85)';
    } else if (bi === 3){ // swamp spores
      p.vx = -8 + Math.random()*16; p.vy = -8 + Math.random()*16;
      p.c = 'rgba(160,230,180,.55)';
    } else { // valley leaves
      p.vx = 8 + Math.random()*24; p.vy = 22 + Math.random()*32;
      p.c = 'rgba(150,190,110,.7)';
    }
    S.amb.push(p);
  }
  for (let i = S.amb.length-1; i >= 0; i--){
    const p = S.amb[i]; p.t -= dt;
    if (p.t <= 0){ S.amb.splice(i,1); continue; }
    p.x += (p.vx + Math.sin(S.t*2 + p.wob)*10)*dt;
    p.y += p.vy*dt;
  }
}

/* ---------- world generation ---------- */
const chunks = new Map();
const COLLECT_TYPES = { coal:1, wood:1, scrap:1, food:1, tree:1 };
const BIOME_RES = [
  [['tree',30],['grass',9],['coal',15],['wood',14],['scrap',13],['food',9],['rock',10]],
  [['tree',7],['grass',5],['coal',21],['wood',8],['scrap',23],['food',10],['rock',26]],
  [['tree',26],['grass',6],['coal',16],['wood',12],['scrap',14],['food',10],['rock',16]],
  [['tree',24],['grass',8],['coal',8],['wood',16],['scrap',14],['food',15],['rock',15]],
  [['tree',7],['grass',4],['coal',25],['wood',7],['scrap',25],['food',6],['rock',26]],
];
const BIOME_DECOR = [
  ['grass','grass','grass','rock'],
  ['drybush','cactus','rock','cactus'],
  ['snowdrift','snowdrift','iceberg','rock'],
  ['reed','reed','pool','grass'],
  ['ashpile','crack','rock','obsidian'],
];
const BIOME_LANDMARK = ['tree','mesa','iceberg','pool','crack'];
const BIOME_DEPOT = [
  ['scrap','food','coal','wood'], ['scrap','food','coal','wood'],
  ['coal','food','scrap','wood'], ['food','wood','scrap','coal'], ['coal','scrap','wood','food'],
];
function pickWeighted(list, roll){
  let total = 0; for (const e of list) total += e[1];
  let v = roll * total;
  for (const e of list){ v -= e[1]; if (v <= 0) return e[0]; }
  return list[list.length-1][0];
}
function genChunk(ci){
  const r = mul32(9176 + ci * 7919);
  const list = [];
  const y0 = ci * CHUNK, y1 = y0 + CHUNK;
  for (let i = 0; i < 5; i++)
    list.push({ type:'patch', x:(r()*2-1)*540, y:y0+r()*CHUNK, s:28+r()*52, tone:r() });
  const depth = clamp(Math.abs(y0) / (GOAL_M*PPM), 0, 1);
  const station = ci % 4 === 0;
  let depotPt = null;
  if (station){
    const side = (ci/4|0) % 2 === 0 ? -1 : 1;
    const bx = side * 185, by = y0 + 40 + r()*(CHUNK-140);
    depotPt = { x: bx, y: by };
    list.push({ type:'depot', x:bx, y:by });
    const kinds = BIOME_DEPOT[biomeIdxAt(by)];
    for (let i = 0; i < 3; i++){
      const a = r()*6.28, d = 100 + r()*70;
      list.push({ type:kinds[(r()*kinds.length)|0], x:bx+Math.cos(a)*d, y:by+Math.sin(a)*d,
        amt: 1 + (r()*2|0) });
    }
    list.push({ type:'zs', x:bx+side*60, y:by+90, n: 2 + Math.round(depth*3) + (r()*2|0) });
  }
  const nRes = 5 + (r()*4|0);
  for (let i = 0; i < nRes; i++){
    const y = y0 + r()*CHUNK;
    const bi = pickBiomeIdx(y, r);
    const type = pickWeighted(BIOME_RES[bi], r());
    let x = (r()*2-1)*500;
    if (Math.abs(x) < 70) x += x < 0 ? -85 : 85;
    if (depotPt && Math.hypot(x-depotPt.x, y-depotPt.y) < 180)
      x = depotPt.x + (x < depotPt.x ? -1 : 1) * 185;
    const p = { type, x, y, s:r(), tone:r() };
    if (COLLECT_TYPES[type]) p.amt = 1 + (r()*3|0);
    list.push(p);
  }
  // biome-flavoured scenery
  for (let i = 0; i < 10; i++){
    const y = y0 + r()*CHUNK;
    const bi = pickBiomeIdx(y, r);
    const table = BIOME_DECOR[bi];
    const type = table[(r()*table.length)|0];
    let x = (r()*2-1)*530;
    if (Math.abs(x) < 58) x += x < 0 ? -72 : 72;
    if (depotPt && Math.hypot(x-depotPt.x, y-depotPt.y) < 185)
      x = depotPt.x + (x < depotPt.x ? -1 : 1) * 195;
    const p = { type, x, y, s:r(), tone:r(), rot:(r()*2-1)*.6 };
    if (COLLECT_TYPES[type]) p.amt = 1 + (r()*2|0);
    list.push(p);
  }
  // occasional large landmark
  if (r() < .58){
    const y = y0 + 40 + r()*(CHUNK-80);
    const bi = biomeIdxAt(y);
    const type = BIOME_LANDMARK[bi];
    let lx = (r()<.5?-1:1)*(130+r()*220);
    if (depotPt && Math.hypot(lx-depotPt.x, y-depotPt.y) < 215)
      lx = depotPt.x + (lx < depotPt.x ? -1 : 1) * 265;
    const p = { type, x:lx, y, s:.75+r()*.7,
      tone:r(), rot:(r()*2-1)*.5 };
    if (type === 'tree') p.amt = 2 + (r()*2|0);
    list.push(p);
  }
  // track debris (logs / rock piles on the rails)
  if (r() < .24 && ci < -8){
    list.push({ type:'debris', kind: r()<.5?'log':'rocks', x:0, y:y0 + 30 + r()*(CHUNK-60),
      hp:2, amt: 1 + (r()*2|0) });
  }
  for (let m = Math.max(1, Math.ceil(-y1/(100*PPM))); m*100*PPM <= -y0 && m*100 < GOAL_M; m++){
    list.push({ type:'sign', x: (m%2? -1:1)*64, y: -m*100*PPM, m: m*100 });
  }
  if (y0 <= -GOAL_M*PPM && y1 >= -GOAL_M*PPM) list.push({ type:'finish', x:0, y:-GOAL_M*PPM });
  chunks.set(ci, list);
  for (const p of list) if (p.type === 'zs') spawnZs(p);
  return list;
}
function propsInView(cy, pad){
  const a = Math.floor((cy - H*0.62 - pad) / CHUNK), b = Math.floor((cy + H*0.62 + pad) / CHUNK);
  const out = [];
  for (let ci = a; ci <= b; ci++){ const c = chunks.get(ci) || genChunk(ci); out.push(...c); }
  return out;
}

/* ---------- zombies ---------- */
const Z_VARIANTS = [
  { hp:3, spd:1.00, dmg:8,  scale:1.00, knock:26,
    skins:['#7d9159','#88996a','#72854f'], shirts:['#39472f','#5a4432','#3f5058'],
    eyes:'#e2f08a' },
  { hp:2, spd:1.26, dmg:6,  scale:0.90, knock:32,
    skins:['#99a268','#8d9960','#a3aa75'], shirts:['#6c382e','#543549','#66452c'],
    eyes:'#ffd766' },
  { hp:4, spd:0.82, dmg:13, scale:1.20, knock:16,
    skins:['#6c8154','#748759'], shirts:['#333a2c','#40332c'],
    eyes:'#ff6a4a' },
];
function spawnZs(zp){
  for (let i = 0; i < zp.n; i++){
    if (S.zombies.length > 42) break;
    const roll = Math.random();
    const v = roll < .16 ? 2 : roll < .44 ? 1 : 0, V = Z_VARIANTS[v];
    const pick = list => list[(Math.random()*list.length)|0];
    S.zombies.push({ x: zp.x + (Math.random()*2-1)*70, y: zp.y + (Math.random()*2-1)*70,
      hx: zp.x, hy: zp.y, hp: V.hp, maxHp: V.hp, wob: Math.random()*6.28, t: Math.random()*10,
      v, spdMul: V.spd, dmg: V.dmg, scale: V.scale, knock: V.knock,
      ang: Math.random()*6.28, skin: pick(V.skins), shirt: pick(V.shirts), eye: V.eyes,
      arm: v === 0 && Math.random() < .3 ? 1 : 0, flash: 0 });
  }
}
function killZombie(i, x, y, reward, hitColor){
  const z = S.zombies[i];
  S.zombies.splice(i,1); puff(x,y,hitColor || (z && z.skin) || '#4a6a3a', 10, 85);
  if (reward === 'scrap'){ S.inv.scrap++; addText(x,y,'+1 SCRAP','#9fd39f'); }
}
function zUpdate(dt){
  const p = S.player, spd = 62 + Math.min(45, dist_m()/45);
  for (let i = S.zombies.length-1; i >= 0; i--){
    const z = S.zombies[i]; z.t += dt;
    z.flash = Math.max(0, (z.flash || 0) - dt);
    const dpx = p.x - z.x, dpy = p.y - z.y, dp = Math.hypot(dpx,dpy) || 1;
    if (!p.aboard && dp < 360){
      const zs = spd * (z.spdMul || 1);
      z.x += dpx/dp * zs * dt; z.y += dpy/dp * zs * dt;
      z.ang = Math.atan2(dpy, dpx);
      if (dp < 25 && p.hurtT <= 0){ damage(z.dmg || 8); p.hurtT = .55; puff(p.x,p.y,'#a33',4,40); }
    } else {
      const a = Math.sin(z.t*.7 + z.wob)*2.4, hx = z.hx + Math.cos(a)*46, hy = z.hy + Math.sin(a)*46;
      const dx = hx-z.x, dy = hy-z.y, d = Math.hypot(dx,dy)||1;
      z.x += dx/d * 18 * dt; z.y += dy/d * 18 * dt;
      z.ang = Math.atan2(dy, dx);
    }
    if (S.train.moving && S.train.fuel > 0 && Math.abs(z.x) < 26 &&
        z.y > S.train.y - 30 && z.y < S.train.y + trainLen() + 8)
      killZombie(i, z.x, z.y, 'scrap');
    else if (Math.abs(z.y - S.cam.y) > 1900) S.zombies.splice(i,1);
  }
}

/* ---------- interactions ---------- */
function damage(n){ S.player.hp -= n; S.hitFlash = 1;
  if (S.player.hp <= 0){ S.player.hp = 0; S.mode = 'dead'; showOverlay('dead'); } }
const RES_PICK = { coal:1, wood:1, scrap:1, food:1, tree:1 };
function nearestRes(){
  let best=null, bd=1e9;
  for (const p of propsInView(S.player.y, 200)){
    if (!RES_PICK[p.type] || !p.amt || p.amt<=0 || p.taken) continue;
    const d = Math.hypot(p.x-S.player.x, p.y-S.player.y);
    // trees are obstacles, so their pickup reach must extend past the collision radius
    const reach = p.type === 'tree' ? 42 : 30;
    if (d < reach && d < bd){ bd=d; best=p; }
  }
  return best;
}
function collect(p){
  p.taken = true;
  const names = {coal:'COAL',wood:'WOOD',scrap:'SCRAP',food:'CANNED FOOD'};
  if (names[p.type]){ S.inv[p.type] += p.amt; addText(p.x,p.y-14,'+'+p.amt+' '+names[p.type],'#ffe9b0');
    puff(p.x,p.y,'#e8d27a',7,55); }
  else if (p.type==='tree'){ S.inv.wood += p.amt+1; addText(p.x,p.y-14,'+'+(p.amt+1)+' WOOD','#b8e0a0');
    puff(p.x,p.y,'#5a8f4a',9,70); }
}
function trainNear(maxD){
  const p = S.player, t = S.train; let best = null, bd = maxD;
  for (const s of segs()){
    const py = clamp(p.y, t.y + s.y0, t.y + s.y1);
    const d = Math.hypot(p.x - clamp(p.x,-23,23), p.y - py);
    if (d <= bd){ bd = d; best = py; }
  }
  return best;
}
function canBoard(){ return !S.player.aboard && trainNear(60) !== null; }
function fallOff(){
  const p = S.player, t = S.train;
  p.aboard = false;
  const side = p.lx < 0 ? -1 : 1;
  p.x = side * 32; p.y = t.y + clamp(p.ly, -8, trainLen() + 8);
  puff(p.x, p.y, '#8a7a56', 6, 50);
  if (t.moving && t.fuel > 0) toast('You jumped off a moving train!');
}
function doAct(){
  const p = S.player, t = S.train;
  if (p.aboard){ fallOff(); return; }
  if (canBoard()){
    const hopping = t.moving && t.fuel > 0;
    p.aboard = true;
    p.ly = clamp(trainNear(60) - t.y, 0, trainLen()); p.lx = p.x < 0 ? -20 : 20;
    p.x = p.lx; p.y = t.y + p.ly;
    toast(hopping ? 'Jumped aboard the moving train!' : 'On deck! Walk to the front cab to drive');
    return;
  }
  if (p.atkT <= 0){
    p.atkT = .42; let hitAny = false;
    for (const z of S.zombies){
      const d = Math.hypot(z.x-p.x, z.y-p.y);
      if (d < 52){
        z.hp--; hitAny = true; z.flash = .16;
        const a = Math.atan2(z.y-p.y, z.x-p.x);
        z.x += Math.cos(a)*(z.knock || 26); z.y += Math.sin(a)*(z.knock || 26);
        puff(z.x,z.y,'#7a5',5,60);
        if (z.hp <= 0) killZombie(S.zombies.indexOf(z), z.x, z.y, null, z.skin);
      }
    }
    if (!hitAny) for (const d of propsInView(p.y, 240)){
      if (d.type !== 'debris' || d.taken) continue;
      if (Math.hypot(d.x-p.x, d.y-p.y) < 52){
        d.hp--; hitAny = true; puff(d.x,d.y,'#c9b98a',6,60);
        if (d.hp <= 0){
          d.taken = true;
          if (d.kind === 'log'){ S.inv.wood += 2; addText(d.x,d.y-14,'+2 WOOD','#b8e0a0'); }
          else { S.inv.scrap += 1; S.inv.coal += 1; addText(d.x,d.y-14,'+SCRAP +COAL','#ffe9b0'); }
        }
        break;
      }
    }
    if (hitAny) S.hitFlash = Math.max(S.hitFlash,.25);
  }
}
function doFuel(){
  if (!S.player.aboard){ toast('Climb aboard to fuel up'); return; }
  const t = S.train;
  if (t.fuel > fuelMax() - 5){ toast('Tank is nearly full'); return; }
  if (S.inv.coal > 0){ S.inv.coal--; t.fuel = Math.min(fuelMax(), t.fuel+40);
    addText(0,t.y+40,'+40 FUEL (coal)','#f7d070'); toast('Shovelled coal +40 ⛽'); }
  else if (S.inv.wood > 0){ S.inv.wood--; t.fuel = Math.min(fuelMax(), t.fuel+24);
    addText(0,t.y+40,'+24 FUEL (wood)','#f7d070'); toast('Fed the fire wood +24 ⛽'); }
  else toast('No coal or wood! Get off & forage');
}
function doEat(){
  const p = S.player;
  if (p.aboard){ toast('Eat when you are off the train'); return; }
  if (S.inv.food <= 0){ toast('No canned food'); return; }
  if (p.hp >= 100){ toast('Already at full health'); return; }
  S.inv.food--; p.hp = Math.min(100, p.hp+35); addText(p.x,p.y-18,'+35 HP','#ef6a5a');
  puff(p.x,p.y,'#ef6a5a',6,50);
}
function doTrain(){
  if (!S.player.aboard){ toast('Climb aboard to drive'); return; }
  const t = S.train;
  if (!t.moving){
    if (t.fuel <= 0){ toast('Out of fuel! Refuel first'); return; }
    if (!inCab()){ toast('Walk to the loco cab (front) to drive'); return; }
    t.moving = true; toast('Full steam ahead!');
  } else { t.moving = false; toast('Brakes set'); }
}

/* ---------- cart building ---------- */
function canAfford(cost){ for (const k in cost) if (S.inv[k] < cost[k]) return false; return true; }
function buildCart(type){
  const def = CART_DEFS[type];
  if (!canBuildType(type)){
    toast(nCarts('workshop') === 0 ? 'Build a workshop car first' : 'Stand inside the workshop car to build');
    return;
  }
  if (!canAfford(def.cost)){ toast('Not enough materials'); return; }
  const firstWorkshop = type === 'workshop' && nCarts('workshop') === 0;
  for (const k in def.cost) S.inv[k] -= def.cost[k];
  S.train.carts.push({ type, store:0, t:0, cool:0, aim:-Math.PI/2 });
  if (firstWorkshop) toast('Workshop bolted on! Walk into it to build more cars');
  else if (type === 'bunker') toast('Coal bunker added — +40 max fuel');
  else toast(def.name + ' added at the rear!');
  puff(0, S.train.y + trainLen() - 40, '#e8d27a', 10, 80);
  if (firstWorkshop){ closeBuild(); return; }
  if (!document.getElementById('bmodal').classList.contains('hide')) renderBuildList();
}
function renderBuildList(){
  const list = document.getElementById('blist');
  const note = document.getElementById('bnote');
  const owned = nCarts('workshop') > 0;
  if (!owned){
    note.textContent = 'Bolt on the WORKSHOP first. It unlocks every other car.';
    note.classList.remove('hide');
  } else if (inZone('workshop')){
    note.textContent = 'Workshop active — pick a car to bolt onto the rear of the train.';
    note.classList.remove('hide');
  } else {
    note.textContent = 'Walk into the workshop car to build more cars.';
    note.classList.remove('hide');
  }
  list.innerHTML = '';
  for (const type in CART_DEFS){
    if (type === 'workshop' && owned) continue;
    const def = CART_DEFS[type];
    let cost = '';
    const icons = { wood:'🪵', coal:'⚫', scrap:'⚙️', food:'🥫' };
    for (const k in def.cost)
      cost += `<i class="${S.inv[k] < def.cost[k] ? 'no' : ''}">${icons[k]}${def.cost[k]}</i>`;
    const el = document.createElement('div'); el.className = 'bitem';
    el.innerHTML = `<div class="ic">${def.icon}</div>
      <div class="info"><b>${def.name}</b><small>${def.desc}</small><div class="cost">${cost}</div></div>
      <button class="bdo ${canBuildType(type) && canAfford(def.cost)?'':'off'}">ADD</button>`;
    el.querySelector('.bdo').onclick = () => buildCart(type);
    list.appendChild(el);
  }
  requestAnimationFrame(() => list.classList.toggle('more', list.scrollHeight > list.clientHeight + 2));
}
document.getElementById('blist').addEventListener('scroll', e => {
  const list = e.currentTarget;
  list.classList.toggle('more', list.scrollHeight - list.scrollTop > list.clientHeight + 2);
});
function openBuild(){
  const m = document.getElementById('bmodal');
  renderBuildList(); m.classList.remove('hide');
  S.paused = true; S.joy.active = false; S.joy.dx = S.joy.dy = 0;
}
function closeBuild(){
  document.getElementById('bmodal').classList.add('hide');
  S.paused = false;
}
function toggleBuild(){
  if (!canOpenBuild()){
    toast(S.player.aboard ? 'Walk into the workshop car to build' : 'Climb aboard to build');
    return;
  }
  const m = document.getElementById('bmodal');
  if (m.classList.contains('hide')) openBuild();
  else closeBuild();
}
document.getElementById('bclose').onclick = closeBuild;

/* ---------- update ---------- */
function blocked(x,y){
  const t = S.train;
  // train body
  if (Math.abs(x) < 24 && y > t.y - 8 && y < t.y + trainLen() + 6) return true;
  for (const p of propsInView(y, 260)){
    if (p.type==='tree' && !p.taken && Math.hypot(x-p.x,y-p.y) < 31) return true;
    if (p.type==='rock' && Math.hypot(x-p.x,y-p.y) < 29) return true;
    if (p.type==='cactus' && Math.hypot(x-p.x,y-p.y) < 16) return true;
    if (p.type==='obsidian'){ const k = .8 + p.s*.5; if (Math.hypot(x-p.x,y-p.y) < 12*k) return true; }
    if (p.type==='iceberg'){ const k = .7 + p.s*.8; if (Math.hypot(x-p.x,y-p.y) < 20*k) return true; }
    if (p.type==='mesa'){ const k = .8 + p.s*.8; if (Math.abs(x-p.x) < 46*k && Math.abs(y-p.y) < 34*k) return true; }
    if (p.type==='debris' && !p.taken && Math.abs(x-p.x)<20 && Math.abs(y-p.y)<16) return true;
    if (p.type==='depot' && x>p.x-75&&x<p.x+75&&y>p.y-52&&y<p.y+52) return true;
  }
  return false;
}
function update(dt){
  S.t += dt;
  S.hitFlash = Math.max(0, S.hitFlash - dt*2.4);
  S.shake = Math.max(0, S.shake - dt*2.2);
  if (S.toastT > 0){ S.toastT -= dt; if (S.toastT <= 0) document.getElementById('toast').style.opacity = 0; }
  if (S.biomeT > 0){
    S.biomeT -= dt;
    if (S.biomeT <= 0) document.getElementById('bioBanner')?.classList.remove('show');
  }
  const p = S.player, t = S.train;

  // announce each new biome as the locomotive crosses its boundary
  const biNow = biomeIdxAt(t.y);
  if (S.mode === 'play' && biNow > S.biomeIdx){ S.biomeIdx = biNow; showBiomeBanner(biNow); }
  else if (biNow < S.biomeIdx) S.biomeIdx = biNow;

  /* ----- train motion + track debris ----- */
  if (t.moving && t.fuel > 0){
    t.y -= TRAIN_SPD * dt; t.fuel -= FUEL_DRAIN * dt;
    if (t.fuel <= 0){ t.fuel = 0; t.moving = false; toast('⚠ Out of fuel — the train is stranded'); }
    if (t.fuel < 20 && !S.lowFuel){ S.lowFuel = true; toast('⚠ Low fuel — stop and refuel'); }
    else if (t.fuel > 32) S.lowFuel = false;
    for (const d of propsInView(t.y, 460)){
      if (d.type !== 'debris' || d.taken) continue;
      if (!d.warn && d.y < t.y - 40 && d.y > t.y - 760){
        d.warn = true; toast('⚠ Debris on the rails ahead!');
      }
      if (d.y > t.y - 34 && d.y < t.y + 12){
        if (hasPlow()){
          d.taken = true; S.inv.scrap++;
          addText(0, d.y, '+1 SCRAP','#9fd39f'); puff(0,d.y,'#c9b98a',9,80);
          S.shake = Math.max(S.shake,.35);
        } else if (!d.thud){
          d.thud = true; t.fuel = Math.max(0, t.fuel-6);
          S.shake = 1; S.hitFlash = .6;
          toast('💥 Debris hit! -6 fuel — build a plow');
        }
      }
    }
    if (Math.random() < dt*22) S.smoke.push({x:(Math.random()*2-1)*4, y:t.y+22, t:1.1, s:8+Math.random()*8});
  }
  if (dist_m() >= GOAL_M && S.mode === 'play'){ S.mode = 'win'; showOverlay('win'); }

  /* ----- player: on deck vs on the ground ----- */
  if (p.aboard){
    let jx = S.joy.dx, jy = S.joy.dy;
    if (S.keys.a||S.keys.ArrowLeft) jx -= 1; if (S.keys.d||S.keys.ArrowRight) jx += 1;
    if (S.keys.w||S.keys.ArrowUp) jy -= 1;   if (S.keys.s||S.keys.ArrowDown) jy += 1;
    const m = Math.hypot(jx,jy); if (m > 1){ jx/=m; jy/=m; }
    const spd = PLAYER_SPD * Math.min(1, m);
    p.lx += jx*spd*dt; p.ly += jy*spd*dt;
    if (m > .1) p.dir = Math.atan2(jy, jx);
    if (Math.abs(p.lx) > 23){ p.lx = clamp(p.lx,-23,23); fallOff(); }
    else if (p.ly < -8){ fallOff(); }
    else if (p.ly > trainLen() + 8){ fallOff(); }
    else { p.x = p.lx; p.y = t.y + p.ly; }
    // cart functions that depend on where you stand
    if (p.aboard){
      if (inZone('medic') && p.hp < 100) p.hp = Math.min(100, p.hp + 2.5*dt);
      const z = zoneAt(p.ly);
      if (z && z.type === 'green' && z.ref.store > 0){
        S.inv.food += z.ref.store;
        addText(p.x, p.y - 18, '+' + z.ref.store + ' FOOD HARVESTED', '#9fd39f');
        toast('Harvested ' + z.ref.store + ' food 🌱'); z.ref.store = 0; z.ref.t = 0;
        puff(p.x, p.y, '#6db35a', 8, 60);
      }
    }
  } else {
    let jx = S.joy.dx, jy = S.joy.dy;
    if (S.keys.a||S.keys.ArrowLeft) jx -= 1; if (S.keys.d||S.keys.ArrowRight) jx += 1;
    if (S.keys.w||S.keys.ArrowUp) jy -= 1;   if (S.keys.s||S.keys.ArrowDown) jy += 1;
    const m = Math.hypot(jx,jy); if (m > 1){ jx/=m; jy/=m; }
    const spd = PLAYER_SPD * Math.min(1, m);
    const nx = p.x + jx*spd*dt, ny = p.y + jy*spd*dt;
    if (!blocked(nx, ny)){ p.x = nx; p.y = ny; }
    else if (!blocked(nx, p.y)) p.x = nx;
    else if (!blocked(p.x, ny)) p.y = ny;
    if (m > .1) p.dir = Math.atan2(jy, jx);
    p.x = clamp(p.x, -560, 560);
    const r = nearestRes(); if (r) collect(r);
    if (t.moving && t.fuel > 0 && Math.abs(p.x) < 26 &&
        p.y > t.y - 34 && p.y < t.y + trainLen() + 10){
      if (p.hurtT <= 0){ damage(18); p.hurtT = .5; }
      p.x = p.x < 0 ? -32 : 32;
    }
  }
  p.hurtT -= dt; p.atkT -= dt;

  /* walk cycle for character animation */
  const wpx = p.aboard ? p.lx : p.x, wpy = p.aboard ? p.ly : p.y;
  const wdx = wpx - (p.pwx === undefined ? wpx : p.pwx);
  const wdy = wpy - (p.pwy === undefined ? wpy : p.pwy);
  const wd = Math.min(12, Math.hypot(wdx, wdy));
  p.walk = ((p.walk || 0) + wd * .23) % 6.283;
  p.walkAmp = lerp(p.walkAmp || 0, wd > .05 ? 1 : 0, 1 - Math.pow(.0004, dt));
  p.pwx = wpx; p.pwy = wpy;

  /* ----- camera follows the player (rides along on deck) ----- */
  const F = p.aboard ? .60 : .55;
  S.focusF = lerp(S.focusF, F, 1 - Math.pow(.01, dt));
  S.cam.x = lerp(S.cam.x, p.x, 1 - Math.pow(.001, dt));
  S.cam.y = lerp(S.cam.y, p.y, 1 - Math.pow(.001, dt));

  /* ----- cart ticks: greenhouse, turret, ----- */
  for (const s of segs()){
    if (!s.ref) continue;
    if (s.type === 'green'){
      if (t.moving && t.fuel > 0 && s.ref.store < 3){
        s.ref.t += dt;
        if (s.ref.t >= 18){ s.ref.t = 0; s.ref.store++; }
      }
    } else if (s.type === 'turret'){
      const cy = t.y + (s.y0 + s.y1)/2;
      s.ref.cool -= dt;
      let tgt = null, bd = 240;
      for (const z of S.zombies){
        const d = Math.hypot(z.x-0, z.y-cy);
        if (d < bd){ bd = d; tgt = z; }
      }
      if (tgt){
        s.ref.aim = Math.atan2(tgt.y - cy, tgt.x - 0);
        if (s.ref.cool <= 0){
          s.ref.cool = 1.4;
          tgt.hp--; tgt.flash = .16;
          const a = s.ref.aim;
          tgt.x += Math.cos(a)*12; tgt.y += Math.sin(a)*12;
          puff(tgt.x, tgt.y, '#7a5', 4, 55);
          S.beams.push({ x1: Math.cos(a)*16, y1: cy + Math.sin(a)*16, x2: tgt.x, y2: tgt.y, t:.12 });
          if (tgt.hp <= 0) killZombie(S.zombies.indexOf(tgt), tgt.x, tgt.y, null, tgt.skin);
        }
      }
    }
  }

  zUpdate(dt);

  for (let i = S.parts.length-1; i >= 0; i--){ const q = S.parts[i];
    q.t -= dt; if (q.t <= 0){ S.parts.splice(i,1); continue; }
    q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= .92; q.vy *= .92; }
  for (let i = S.smoke.length-1; i >= 0; i--){ const q = S.smoke[i];
    q.t -= dt; if (q.t <= 0){ S.smoke.splice(i,1); continue; }
    q.y += 26*dt; q.x += Math.sin(q.t*6)*10*dt; q.s += 14*dt; }
  for (let i = S.texts.length-1; i >= 0; i--){ const q = S.texts[i];
    q.t -= dt; q.y -= 34*dt; if (q.t <= 0) S.texts.splice(i,1); }
  for (let i = S.beams.length-1; i >= 0; i--){ S.beams[i].t -= dt;
    if (S.beams[i].t <= 0) S.beams.splice(i,1); }

  ambientUpdate(dt);
  uiSync();
}

/* ---------- rendering ---------- */
function rr(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function fr(x,y,w,h,r,c){ ctx.fillStyle=c; rr(x,y,w,h,r); ctx.fill(); }

const GROUND_DECOR = { grass:1, pool:1, snowdrift:1, crack:1, ashpile:1, drybush:1, reed:1 };
function biomeColorCssAt(y, field){
  const m = biomeMix(y);
  return m.t ? rgbCss(mix3(BIOMES[m.a][field], BIOMES[m.b][field], m.t)) : rgbCss(BIOMES[m.a][field]);
}
function biomeGradient(field, y0, y1, n){
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for (let i = 0; i <= n; i++){
    const y = y0 + (y1 - y0) * i / n;
    g.addColorStop(i/n, biomeColorCssAt(y, field));
  }
  return g;
}
function propBiome(p){ return BIOMES[biomeIdxAt(p.y)]; }

function drawGrassProp(p){
  const B = propBiome(p), x = p.x, y = p.y, s = p.s;
  ctx.save();
  ctx.strokeStyle = B.grass; ctx.lineWidth = 2;
  if (B.id === 'swamp'){
    ctx.lineWidth = 2.2;
    for (let i = -1; i <= 1; i++){
      const h = 12 + s*14;
      ctx.beginPath(); ctx.moveTo(x+i*4,y);
      ctx.quadraticCurveTo(x+i*4+(i?i*7:2), y-h*.6, x+i*4+i*3, y-h); ctx.stroke();
    }
  } else if (B.id === 'desert'){
    for (let i = -1; i <= 1; i++){
      ctx.beginPath(); ctx.moveTo(x+i*4,y);
      ctx.lineTo(x+i*5+(i===0?3:0), y-7-s*7); ctx.stroke();
    }
  } else if (B.id === 'frozen'){
    ctx.strokeStyle = 'rgba(220,240,250,.78)';
    for (let i = -1; i <= 1; i++){
      ctx.beginPath(); ctx.moveTo(x+i*4,y);
      ctx.lineTo(x+i*4+(s-.5)*5, y-7-s*5); ctx.stroke();
    }
  } else {
    for (let i = -1; i <= 1; i++){
      ctx.beginPath(); ctx.moveTo(x+i*4, y);
      ctx.lineTo(x+i*4 + (s-.5)*6, y-8-s*5); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawTreeProp(p){
  const B = propBiome(p), x = p.x, y = p.y, s = p.s;
  ctx.save();
  if (B.id === 'desert'){
    ctx.fillStyle = 'rgba(0,0,0,.26)';
    ctx.beginPath(); ctx.ellipse(x+4,y+8,13,6,0,0,6.3); ctx.fill();
    ctx.strokeStyle = B.trunk; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x,y+9); ctx.lineTo(x,y-8); ctx.stroke();
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(x,y-2); ctx.lineTo(x-10,y-12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-5); ctx.lineTo(x+9,y-15); ctx.stroke();
    ctx.fillStyle = B.crown;
    ctx.beginPath(); ctx.arc(x-11,y-13,5,0,6.3); ctx.arc(x+10,y-16,5.5,0,6.3);
    ctx.arc(x,y-14,4,0,6.3); ctx.fill();
  } else if (B.id === 'frozen'){
    ctx.fillStyle = 'rgba(0,0,0,.24)';
    ctx.beginPath(); ctx.ellipse(x+4,y+9,13,6,0,0,6.3); ctx.fill();
    ctx.fillStyle = B.trunk; ctx.fillRect(x-2,y-2,4,13);
    for (let i = 0; i < 3; i++){
      const w = (11 - i*2.5) * (.8+s*.4), yy = y-4-i*8;
      ctx.fillStyle = B.crown;
      ctx.beginPath(); ctx.moveTo(x-w, yy+2); ctx.lineTo(x, yy-11); ctx.lineTo(x+w, yy+2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = B.crown2;
      ctx.beginPath(); ctx.moveTo(x-w*.75, yy-1); ctx.lineTo(x, yy-10); ctx.lineTo(x+w*.75, yy-1); ctx.closePath(); ctx.fill();
    }
  } else if (B.id === 'swamp'){
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(x+5,y+7,16,9,0,0,6.3); ctx.fill();
    ctx.fillStyle = B.trunk; ctx.fillRect(x-3,y-2,6,15);
    ctx.fillStyle = B.crown; ctx.beginPath(); ctx.arc(x,y-6,14+s*2,0,6.3); ctx.fill();
    ctx.fillStyle = B.crown2; ctx.beginPath(); ctx.arc(x-5,y-9,7,0,6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(120,170,110,.55)'; ctx.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++){
      ctx.beginPath(); ctx.moveTo(x+i*5, y-2); ctx.lineTo(x+i*5+1, y+10+Math.abs(i)*2); ctx.stroke();
    }
  } else if (B.id === 'ash'){
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(x+4,y+8,12,6,0,0,6.3); ctx.fill();
    ctx.strokeStyle = B.trunk; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x,y+10); ctx.lineTo(x,y-12); ctx.stroke();
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(x,y-3); ctx.lineTo(x-9,y-11); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-7); ctx.lineTo(x+8,y-14); ctx.stroke();
    ctx.fillStyle = `rgba(255,120,40,${.35+Math.sin(S.t*4+p.tone*9)*.25})`;
    ctx.beginPath(); ctx.arc(x-8,y-12,1.8,0,6.3); ctx.arc(x+7,y-15,1.5,0,6.3);
    ctx.arc(x,y+3,1.4,0,6.3); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.ellipse(x+5,y+7,17,10,0,0,6.3); ctx.fill();
    ctx.fillStyle = B.trunk; ctx.beginPath(); ctx.arc(x,y,5,0,6.3); ctx.fill();
    ctx.fillStyle = p.s < .5 ? B.crown2 : B.crown;
    ctx.beginPath(); ctx.arc(x,y,14+s*5,0,6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,220,.14)';
    ctx.beginPath(); ctx.arc(x-5,y-5,7,0,6.3); ctx.fill();
  }
  ctx.restore();
}

function drawRockProp(p){
  const B = propBiome(p), x = p.x, y = p.y, s = .8 + p.s*.5;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(x+4,y+6,12*s,6*s,0,0,6.3); ctx.fill();
  ctx.fillStyle = B.rock;
  ctx.beginPath();
  ctx.moveTo(x-11*s,y+6*s); ctx.lineTo(x-4*s,y-9*s); ctx.lineTo(x+8*s,y-7*s);
  ctx.lineTo(x+12*s,y+5*s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.14)';
  ctx.beginPath(); ctx.arc(x-2*s,y-4*s,3*s,0,6.3); ctx.fill();
  if (B.id === 'frozen'){
    ctx.strokeStyle = 'rgba(220,245,255,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x-6*s,y+1); ctx.lineTo(x+4*s,y-3); ctx.stroke();
  } else if (B.id === 'ash'){
    ctx.strokeStyle = 'rgba(255,120,50,.5)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(x-5*s,y+2); ctx.lineTo(x+5*s,y-2); ctx.stroke();
  }
  ctx.restore();
}

function drawDecorProp(p){
  const x = p.x, y = p.y, s = p.s, tone = p.tone;
  ctx.save();
  if (p.type === 'cactus'){
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(x+4,y+9,10,5,0,0,6.3); ctx.fill();
    ctx.strokeStyle = '#3f7a46'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x,y+9); ctx.lineTo(x,y-13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-2); ctx.lineTo(x-9,y-2); ctx.lineTo(x-9,y-12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-6); ctx.lineTo(x+9,y-6); ctx.lineTo(x+9,y-14); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.20)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x-2,y+6); ctx.lineTo(x-2,y-11); ctx.stroke();
    ctx.fillStyle = '#e86a7a'; ctx.beginPath(); ctx.arc(x,y-15,2.6,0,6.3); ctx.fill();
  } else if (p.type === 'drybush'){
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(x+3,y+5,10,4,0,0,6.3); ctx.fill();
    ctx.strokeStyle = '#8a7444'; ctx.lineWidth = 1.6;
    for (let i = 0; i < 6; i++){
      const a = i/6*6.28, r = 6 + s*6;
      ctx.beginPath(); ctx.arc(x, y, r, a, a+1.1); ctx.stroke();
    }
  } else if (p.type === 'snowdrift'){
    ctx.fillStyle = 'rgba(228,242,250,.6)';
    ctx.beginPath(); ctx.ellipse(x,y,18+s*10,7+s*4,0,0,6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(x-3,y-2,9,3.5,0,0,6.3); ctx.fill();
  } else if (p.type === 'iceberg'){
    const k = .7 + s*.8;
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(x+5,y+9,22*k,9*k,0,0,6.3); ctx.fill();
    ctx.fillStyle = '#a9d6e8';
    ctx.beginPath(); ctx.moveTo(x-18*k,y+8*k); ctx.lineTo(x-8*k,y-28*k);
    ctx.lineTo(x+6*k,y-34*k); ctx.lineTo(x+18*k,y-4*k); ctx.lineTo(x+10*k,y+9*k);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#dff3fb';
    ctx.beginPath(); ctx.moveTo(x-8*k,y-28*k); ctx.lineTo(x+6*k,y-34*k);
    ctx.lineTo(x+2*k,y-14*k); ctx.lineTo(x-6*k,y-10*k); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7fb4c9';
    ctx.beginPath(); ctx.moveTo(x+18*k,y-4*k); ctx.lineTo(x+10*k,y+9*k);
    ctx.lineTo(x+2*k,y-10*k); ctx.closePath(); ctx.fill();
  } else if (p.type === 'pool'){
    const k = .8 + s*.8;
    ctx.fillStyle = 'rgba(18,52,46,.88)';
    ctx.beginPath(); ctx.ellipse(x,y,26*k,15*k,0,0,6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(90,160,130,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x,y,26*k,15*k,0,0,6.3); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,220,190,.28)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(x-2,y,13*k,6*k,0,0,6.3); ctx.stroke();
    ctx.fillStyle = '#4f7a4a';
    ctx.beginPath(); ctx.arc(x+9*k,y-2,4.6*k,0,6.3); ctx.fill();

    for (let i = -2; i <= 2; i++){
      const h = 14 + s*13 + (i===0?5:0), bx = x + i*4;
      ctx.beginPath(); ctx.moveTo(bx,y+2); ctx.quadraticCurveTo(bx+i*4, y-h*.55, bx+i*2, y-h); ctx.stroke();
      if (i % 2 === 0){
        ctx.fillStyle = '#6a4e32';
        ctx.beginPath(); ctx.ellipse(bx+i*2, y-h, 1.8, 4, 0, 0, 6.3); ctx.fill();
