<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b14">

<style>
:root{color-scheme:dark;--cyan:#62e8ff;--blue:#277bba;--gold:#e5c779;--muted:#75899f;--panel:rgba(9,17,29,.92)}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#060a12;color:#eaf3ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}body{display:flex;justify-content:center;align-items:stretch;background:radial-gradient(ellipse at 50% 45%,#102139 0,#080e19 48%,#050810 100%)}button{font:inherit;color:inherit}.game{width:min(100%,1100px);height:100dvh;display:flex;flex-direction:column;position:relative;border-inline:1px solid #14243a;background:linear-gradient(180deg,rgba(8,14,24,.98),rgba(7,12,22,.95));box-shadow:0 0 90px #00101e}.topbar{height:76px;flex:none;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #1b3045;background:linear-gradient(90deg,#0b1422,#111d2b 50%,#0a1421);z-index:2}.brand{min-width:220px;display:flex;align-items:center;gap:11px}.sigil{width:38px;height:38px;border:1px solid #61d9fa;border-radius:50%;display:grid;place-items:center;color:#8cecff;font-size:19px;box-shadow:0 0 18px #2aa9d733,inset 0 0 12px #2aa9d71e}.brand strong{display:block;font-size:13px;letter-spacing:.17em;text-transform:uppercase;white-space:nowrap}.brand small{display:block;color:#78a9c5;font-size:9px;letter-spacing:.2em;margin-top:3px}.stats{display:flex;flex:1;justify-content:flex-end;gap:clamp(7px,1.7vw,22px)}.stat{min-width:76px}.stat label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8296ab;display:block;margin-bottom:6px;white-space:nowrap}.stat b{font-size:13px;font-variant-numeric:tabular-nums}.meter{height:4px;width:74px;border-radius:4px;background:#1a2939;margin-top:5px;overflow:hidden}.meter i{height:100%;display:block;width:100%;background:linear-gradient(90deg,#2c91c8,#6ceaff);box-shadow:0 0 9px #57dfff}.stat.gold b{color:var(--gold)}.stat.wave b{color:#a6eaff}.arena{position:relative;flex:1;min-height:0;overflow:hidden;background:#080e18}.arena canvas{width:100%;height:100%;display:block;touch-action:none}.arena-hint{position:absolute;left:15px;top:13px;color:#7e9ab3;font-size:10px;letter-spacing:.1em;pointer-events:none;text-shadow:0 1px 5px #000}.toast{position:absolute;top:42px;left:50%;transform:translateX(-50%);padding:7px 13px;border:1px solid #31516a;border-radius:20px;background:#0a1724d9;color:#b9efff;font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}.bottom{flex:none;padding:10px 15px calc(11px + env(safe-area-inset-bottom));border-top:1px solid #1b3045;background:linear-gradient(180deg,#0d1724,#090f19)}.actions{display:grid;grid-template-columns:1fr 1fr 1.12fr;gap:9px;max-width:760px;margin:auto}.action{height:54px;border:1px solid #263d53;border-radius:10px;background:linear-gradient(180deg,#152537,#0e1a29);display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;position:relative;overflow:hidden;transition:.15s;user-select:none;-webkit-tap-highlight-color:transparent}.action:active{transform:scale(.97)}.action.selected{border-color:#64dcf6;box-shadow:inset 0 0 18px #43cdf21a,0 0 14px #35c3ef22}.action .icon{font-size:19px;color:#8aeaff}.action .copy{text-align:left}.action strong{font-size:11px;display:block;letter-spacing:.04em}.action small{font-size:9px;color:#8da2b6;display:block;margin-top:3px}.action.force{border-color:#3a6680;background:linear-gradient(135deg,#102337,#152a3a)}.action.force strong{color:#a7efff}.action .cooldown{position:absolute;inset:auto 0 0;height:0;background:#60dfff3a;pointer-events:none;transition:height .1s}.footer-note{text-align:center;color:#5c7389;font-size:9px;letter-spacing:.08em;margin-top:8px}.overlay{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;padding:18px;background:#030811bd;backdrop-filter:blur(8px)}.overlay.show{display:flex}.modal{width:min(430px,100%);border:1px solid #31516a;border-radius:16px;padding:25px;background:linear-gradient(145deg,#132337,#0a1421 70%);box-shadow:0 20px 80px #000a;text-align:center}.eyebrow{font-size:9px;letter-spacing:.26em;color:#71dafa;text-transform:uppercase}.modal h1{font-size:26px;letter-spacing:.04em;margin:10px 0;color:#e9f8ff}.modal p{font-size:13px;color:#9bb0c2;line-height:1.55}.shop-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.upgrade{border:1px solid #2b4359;background:#0b1725;border-radius:11px;padding:13px 10px;cursor:pointer}.upgrade:hover{border-color:#73dff6}.upgrade b{display:block;font-size:12px}.upgrade span{font-size:10px;color:#8da7ba;display:block;margin:5px 0}.upgrade em{font-size:10px;color:#e6c97b;font-style:normal}.primary{border:1px solid #64d9ef;border-radius:9px;background:linear-gradient(90deg,#167da2,#176080);padding:12px 23px;font-weight:700;letter-spacing:.06em;cursor:pointer;box-shadow:0 0 20px #2cbde533}.primary:active{transform:scale(.98)}.scoreline{font-size:12px;color:#d4e4ef;margin:15px 0 20px}.modal .note{font-size:10px;color:#738ca1}.rotate-tip{display:none}
@media(max-width:640px){.topbar{height:90px;padding:6px 10px;gap:4px;display:grid;grid-template-columns:1fr;grid-template-rows:34px 36px;align-content:center}.brand{min-width:0;width:100%;gap:7px}.sigil{width:30px;height:30px;font-size:15px}.brand strong{font-size:10px;letter-spacing:.12em}.brand small{font-size:8px}.stats{gap:8px;width:100%;min-width:0;justify-content:space-between}.stat{min-width:0;flex:1}.stat label{font-size:7px;letter-spacing:.07em;margin-bottom:4px}.stat b{font-size:11px}.meter{width:100%;height:3px}.arena-hint{font-size:8px;left:9px;top:9px}.bottom{padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.actions{gap:6px}.action{height:50px;gap:5px;border-radius:8px;flex-direction:column}.action .icon{font-size:15px;line-height:15px}.action .copy{text-align:center}.action strong{font-size:9px}.action small{font-size:8px;margin-top:1px}.footer-note{font-size:8px;margin-top:6px}}
</style>

<body><main class="game">
<header class="topbar"><div class="brand"><div class="sigil">✧</div><div><strong>Jedi Temple Defense</strong><small>ARCHIVE SECTOR · 03</small></div></div><div class="stats"><div class="stat"><label>Temple</label><b id="healthText">100%</b><div class="meter"><i id="healthBar"></i></div></div><div class="stat"><label>Force</label><b id="forceText">100%</b><div class="meter"><i id="forceBar"></i></div></div><div class="stat wave"><label>Wave</label><b id="waveText">01 / 05</b></div><div class="stat gold"><label>Credits</label><b id="creditsText">130</b></div><div class="stat"><label>Score</label><b id="scoreText">0000</b></div></div></header>
<section class="arena" id="arena"><canvas id="gameCanvas"></canvas><div class="arena-hint">TAP THE ARCHIVE FLOOR TO MOVE · HOLD POSITION TO DEFEND</div><div class="toast" id="toast"></div></section>
<footer class="bottom"><div class="actions"><button class="action" id="pylonBtn"><span class="icon">◈</span><span class="copy"><strong>Shield Pylon</strong><small>60 cr · slow field</small></span></button><button class="action" id="turretBtn"><span class="icon">⌖</span><span class="copy"><strong>Blaster Turret</strong><small>85 cr · auto-fire</small></span></button><button class="action force" id="forceBtn"><span class="icon">✦</span><span class="copy"><strong>Force Push</strong><small id="forceLabel">READY</small></span><i class="cooldown" id="cooldown"></i></button></div><div class="footer-note">DEFLECT BOLTS · PROTECT THE ARCHIVE CORE · SURVIVE FIVE WAVES</div></footer>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),arena=document.getElementById('arena');
const ui={healthText:document.getElementById('healthText'),healthBar:document.getElementById('healthBar'),forceText:document.getElementById('forceText'),forceBar:document.getElementById('forceBar'),waveText:document.getElementById('waveText'),creditsText:document.getElementById('creditsText'),scoreText:document.getElementById('scoreText'),toast:document.getElementById('toast'),overlay:document.getElementById('overlay'),modal:document.getElementById('modal'),cooldown:document.getElementById('cooldown'),forceLabel:document.getElementById('forceLabel')};
let W=900,H=600,dpr=1,last=0,gameTime=0,gameState='playing',wave=1,health=100,force=100,credits=130,score=0,spawned=0,kills=0,waveTotal=0,spawnClock=0,intermission=0,forceCD=0,selected='',hero={x:450,y:300,tx:450,ty:300,r:14,hp:100,attack:0},enemies=[],bolts=[],buildings=[],fx=[],decor=[],speedLevel=0,damageLevel=0,turretDamage=1;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){const r=arena.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);hero.x=clamp(hero.x,30,W-30);hero.y=clamp(hero.y,30,H-30);hero.tx=clamp(hero.tx,30,W-30);hero.ty=clamp(hero.ty,30,H-30);decor=[];for(let i=0;i<38;i++)decor.push({x:rand(0,W),y:rand(0,H),r:rand(.5,1.7),a:rand(.12,.45)});}
new ResizeObserver(resize).observe(arena);resize();
function startWave(n){wave=n;spawned=0;kills=0;waveTotal=n===5?9+n*2:8+n*3;spawnClock=1.1;gameState='playing';ui.overlay.classList.remove('show');showToast(`WAVE ${String(n).padStart(2,'0')} · INCOMING`);}
function showToast(t){ui.toast.textContent=t;ui.toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>ui.toast.classList.remove('show'),1900)}
function spawnEnemy(){const side=Math.random()<.5?'left':'right',boss=wave===5&&spawned===waveTotal-1;const y=rand(75,H-70),hp=boss?155:20+wave*8+(Math.random()<.2?18:0),e={x:side==='left'?-22:W+22,y,side,hp,max:hp,r:boss?25:rand(10,14),speed:(boss?17:rand(24,33))+wave*1.7,boss,shoot:rand(1.3,3),hit:0,phase:rand(0,6)};enemies.push(e);spawned++;}
function nearestEnemy(x,y){let best=null,bd=Infinity;for(const e of enemies){const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e}}return best;}
function hurtEnemy(e,dmg){e.hp-=dmg;e.hit=.12;if(e.hp<=0){const i=enemies.indexOf(e);if(i>=0){enemies.splice(i,1);score+=e.boss?1500:100;credits+=e.boss?100:18;fx.push({x:e.x,y:e.y,r:4,max:e.boss?60:26,t:.4,color:e.boss?'#ff5362':'#70ddff'});if(e.boss)showToast('BOSS DROID DESTROYED · +100 CR')}}}
function enemyBolt(e){const dx=hero.x-e.x,dy=hero.y-e.y,len=Math.hypot(dx,dy)||1;bolts.push({x:e.x,y:e.y,vx:dx/len*195,vy:dy/len*195,team:'red',r:4,life:3});}
function build(kind,x,y){const cost=kind==='pylon'?60:85;if(credits<cost){showToast('NOT ENOUGH CREDITS');return}if(Math.hypot(x-W/2,y-H/2)<45||buildings.some(b=>Math.hypot(b.x-x,b.y-y)<45)){showToast('BUILD SITE BLOCKED');return}credits-=cost;buildings.push({kind,x,y,shoot:rand(.1,.5),pulse:rand(0,6)});selected='';document.querySelectorAll('.action').forEach(b=>b.classList.remove('selected'));showToast(kind==='pylon'?'SHIELD PYLON DEPLOYED':'BLASTER TURRET ONLINE');}
function push(){if(gameState!=='playing'||forceCD>0||force<40){showToast(forceCD>0?'FORCE PUSH RECHARGING':'INSUFFICIENT FORCE ENERGY');return}force-=40;forceCD=10;fx.push({x:hero.x,y:hero.y,r:12,max:Math.min(W,H)*.38,t:.65,color:'#68eaff',wave:true});for(const e of [...enemies]){const dx=e.x-hero.x,dy=e.y-hero.y,d=Math.hypot(dx,dy);if(d<Math.min(W,H)*.38){hurtEnemy(e,32+damageLevel*7);const n=Math.max(d,1);e.x+=dx/n*100;e.y+=dy/n*100}}showToast('FORCE WAVE RELEASED');}
function beginShop(){gameState='shop';credits+=45+wave*10;ui.modal.innerHTML=`<div class="eyebrow">WAVE ${wave} SECURED</div><h1>Wave Complete</h1><p>The archive is holding. Spend your field credits before the next assault.</p><div class="shop-cards"><button class="upgrade" id="speedUpgrade"><b>⚡ Fleet Footwork</b><span>Increase Jedi movement speed</span><em>90 credits · Level ${speedLevel+1}</em></button><button class="upgrade" id="damageUpgrade"><b>✦ Focused Strikes</b><span>Boost all damage dealt</span><em>100 credits · Level ${damageLevel+1}</em></button></div><p class="note">Current credits: <b style="color:#e6c97b">${credits}</b></p><button class="primary" id="nextWave">${wave===5?'CLAIM VICTORY':'BEGIN WAVE '+(wave+1)}</button>`;ui.overlay.classList.add('show');document.getElementById('speedUpgrade').onclick=()=>{if(credits>=90){credits-=90;speedLevel++;document.querySelector('#speedUpgrade em').textContent=`PURCHASED · Level ${speedLevel}`}else showToast('NOT ENOUGH CREDITS')};document.getElementById('damageUpgrade').onclick=()=>{if(credits>=100){credits-=100;damageLevel++;document.querySelector('#damageUpgrade em').textContent=`PURCHASED · Level ${damageLevel}`}else showToast('NOT ENOUGH CREDITS')};document.getElementById('nextWave').onclick=()=>{if(wave===5)endGame(true);else startWave(wave+1)};}
function endGame(win){gameState=win?'victory':'defeat';ui.modal.innerHTML=`<div class="eyebrow">${win?'THE ARCHIVES ENDURE':'ARCHIVE SIGNAL LOST'}</div><h1>${win?'Temple Preserved!':'Temple Fallen'}</h1><p>${win?'The droid assault is over. The knowledge of the Jedi Order is safe.':'The droids breached the archive core. The temple has fallen.'}</p><div class="scoreline">FINAL SCORE <b style="color:#e7ce87">${String(score).padStart(5,'0')}</b> &nbsp; · &nbsp; CREDITS <b style="color:#e7ce87">${credits}</b></div><button class="primary" id="again">${win?'PLAY AGAIN':'TRY AGAIN'}</button>`;ui.overlay.classList.add('show');document.getElementById('again').onclick=reset;}
function reset(){health=100;force=100;credits=130;score=0;wave=1;forceCD=0;speedLevel=0;damageLevel=0;enemies=[];bolts=[];buildings=[];fx=[];hero.x=W/2;hero.y=H/2;hero.tx=hero.x;hero.ty=hero.y;startWave(1)}
function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(gameState!=='playing')return;e.preventDefault();const p=point(e);if(selected){build(selected,p.x,p.y);return}hero.tx=clamp(p.x,25,W-25);hero.ty=clamp(p.y,25,H-25)});
document.getElementById('pylonBtn').onclick=()=>choose('pylon');document.getElementById('turretBtn').onclick=()=>choose('turret');document.getElementById('forceBtn').onclick=push;
function choose(k){if(gameState!=='playing')return;selected=selected===k?'':k;document.querySelectorAll('.action').forEach(b=>b.classList.remove('selected'));if(selected)document.getElementById(k==='pylon'?'pylonBtn':'turretBtn').classList.add('selected');showToast(selected?`TAP THE FLOOR TO PLACE ${k==='pylon'?'SHIELD PYLON':'BLASTER TURRET'}`:'PLACEMENT CANCELLED')}
function update(dt){if(gameState!=='playing')return;gameTime+=dt;force=Math.min(100,force+6*dt);forceCD=Math.max(0,forceCD-dt);const dx=hero.tx-hero.x,dy=hero.ty-hero.y,d=Math.hypot(dx,dy);if(d>1){const move=(130+speedLevel*24)*dt;hero.x+=dx/d*Math.min(move,d);hero.y+=dy/d*Math.min(move,d)}hero.attack-=dt;
if(spawned<waveTotal){spawnClock-=dt;if(spawnClock<=0){spawnEnemy();spawnClock=wave===5?.85:Math.max(.7,1.7-wave*.13)}}
for(const e of [...enemies]){const core={x:W/2,y:H/2},toX=core.x-e.x,toY=core.y-e.y,len=Math.hypot(toX,toY)||1;let slow=1;for(const b of buildings)if(b.kind==='pylon'&&Math.hypot(e.x-b.x,e.y-b.y)<115)slow=.54;e.x+=toX/len*e.speed*slow*dt;e.y+=toY/len*e.speed*slow*dt;e.phase+=dt*3;e.shoot-=dt;e.hit=Math.max(0,e.hit-dt);if(e.shoot<=0&&Math.hypot(e.x-hero.x,e.y-hero.y)<Math.min(W,H)*.62){enemyBolt(e);e.shoot=rand(2,3.8)}if(len<31){health-=e.boss?20:10;const i=enemies.indexOf(e);if(i>=0)enemies.splice(i,1);fx.push({x:core.x,y:core.y,r:6,max:40,t:.3,color:'#ff5d70'});if(health<=0){health=0;endGame(false);return}}}
// Close-range lightsaber auto-strike and a bright parry ring.
const target=nearestEnemy(hero.x,hero.y);if(target&&dist(target,hero)<68&&hero.attack<=0){hurtEnemy(target,12+damageLevel*5);hero.attack=.62;fx.push({x:target.x,y:target.y,r:2,max:26,t:.19,color:'#76eaff',slash:true})}
for(const b of buildings){b.pulse+=dt;b.shoot-=dt;if(b.kind==='turret'&&b.shoot<=0){const e=nearestEnemy(b.x,b.y);if(e&&Math.hypot(e.x-b.x,e.y-b.y)<290){const vx=e.x-b.x,vy=e.y-b.y,l=Math.hypot(vx,vy)||1;bolts.push({x:b.x,y:b.y,vx:vx/l*360,vy:vy/l*360,team:'blue',r:3,life:1.5,dmg:12+damageLevel*5});b.shoot=.85}}}
for(const b of [...bolts]){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.team==='red'&&Math.hypot(b.x-hero.x,b.y-hero.y)<27){const target=nearestEnemy(b.x,b.y);if(target){const vx=target.x-b.x,vy=target.y-b.y,l=Math.hypot(vx,vy)||1;b.vx=vx/l*400;b.vy=vy/l*400;b.team='blue';b.r=4;b.dmg=24+damageLevel*4;score+=15;fx.push({x:b.x,y:b.y,r:2,max:20,t:.2,color:'#8df3ff'})}else{bolts.splice(bolts.indexOf(b),1);fx.push({x:b.x,y:b.y,r:2,max:13,t:.18,color:'#ff5061'});continue}}else if(b.team==='blue'){const e=nearestEnemy(b.x,b.y);if(e&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+8){hurtEnemy(e,b.dmg||12);bolts.splice(bolts.indexOf(b),1);continue}}if(b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40)bolts.splice(bolts.indexOf(b),1)}
for(const f of [...fx]){f.t-=dt;f.r+=(f.max-f.r)*Math.min(1,dt*12);if(f.t<=0)fx.splice(fx.indexOf(f),1)}if(spawned===waveTotal&&enemies.length===0&&gameState==='playing')beginShop();render();updateUI();}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function render(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0b1725');bg.addColorStop(.52,'#0a111d');bg.addColorStop(1,'#0c1826');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
// Star-dusted archive chamber and luminous data shelves.
for(const s of decor){ctx.fillStyle=`rgba(96,190,228,${s.a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
const shelfW=Math.min(105,W*.13);for(const side of [0,W-shelfW]){ctx.fillStyle='rgba(12,28,43,.68)';ctx.fillRect(side,0,shelfW,H);for(let y=28;y<H;y+=54){line(side+8,y,side+shelfW-8,y,'#1c4963',1);for(let x=side+15;x<side+shelfW-10;x+=17){const h=7+Math.abs(Math.floor(x*7+y*13)%15),a=.08+Math.abs(Math.sin(x*3+y*17))*.1;ctx.fillStyle=`rgba(56,162,200,${a})`;ctx.fillRect(x,y-h,8,h)}}}
// Floor grid converges on the archive node.
ctx.save();ctx.strokeStyle='rgba(60,137,177,.13)';ctx.lineWidth=1;for(let i=-6;i<=6;i++){line(W/2+i*70,H*.48,W/2+i*130,H,'rgba(61,131,166,.14)')}for(let j=0;j<8;j++){const y=H*.49+j*j*2.7;line(shelfW,y,W-shelfW,y,'rgba(61,131,166,.11)')}ctx.restore();
const cx=W/2,cy=H/2;const coreGlow=ctx.createRadialGradient(cx,cy,8,cx,cy,100);coreGlow.addColorStop(0,'rgba(58,190,239,.16)');coreGlow.addColorStop(1,'rgba(32,116,168,0)');ctx.fillStyle=coreGlow;ctx.fillRect(cx-105,cy-105,210,210);
ctx.save();ctx.translate(cx,cy);ctx.rotate(gameTime*.025);for(let r of [30,39,53]){ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.strokeStyle=r===39?'rgba(87,208,245,.36)':'rgba(72,156,196,.23)';ctx.setLineDash(r===53?[3,8]:[]);ctx.lineWidth=1;ctx.stroke()}ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(22,0);ctx.lineTo(0,24);ctx.lineTo(-22,0);ctx.closePath();ctx.fillStyle='#102f43';ctx.fill();ctx.strokeStyle='#5adcf4';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();ctx.fillStyle='#7faec3';ctx.font='8px system-ui';ctx.textAlign='center';ctx.fillText('ARCHIVE CORE',cx,cy+67);
// Structures and fields.
